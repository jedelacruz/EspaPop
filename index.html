const TB=s=>'<div class="tw"><table class="lt">'+s.split(';').map((r,i)=>'<tr>'+r.split('|').map(c=>i?`<td>${c}</td>`:`<th>${c}</th>`).join('')+'</tr>').join('')+'</table></div>';
const W8=s=>`<div class="warn">⚠️ ${s}</div>`;
const LESSONS=[
{h:'Ser vs estar · gender · pronouns',b:`<h4>Two verbs for “to be”</h4><p><b>Ser</b> is for what something <i>is</i>: identity, origin, job, personality, time. <b>Estar</b> is for <i>where</i> something is and <i>how</i> it is right now.</p>${TB('|ser|estar;yo|soy|estoy;tú|eres|estás;él / ella / usted|es|está;nosotros|somos|estamos;ellos / ustedes|son|están')}<p><i>Soy Ana. Soy de Manila. Soy agente.</i> → ser<br><i>Estoy en casa. Estoy cansada.</i> → estar</p><h4>Every noun has a gender</h4><p>Most nouns ending in <b>-o</b> are masculine: <i>el libro, un carro</i>. Most ending in <b>-a</b> are feminine: <i>la casa, una mesa</i>. Plural adds -s or -es: <i>los libros, las ciudades</i>.</p>${TB('|masculine|feminine;the|el / los|la / las;a / some|un / unos|una / unas')}${W8('Learn the article with the word. <i>el día, el problema, el mapa</i> are masculine; <i>la mano, la foto</i> are feminine.')}<h4>Who: subject pronouns</h4><p><i>yo</i> I · <i>tú</i> you (friend) · <i>usted</i> you (polite) · <i>él / ella</i> he / she · <i>nosotros</i> we · <i>ustedes</i> you all · <i>ellos / ellas</i> they. Spain also uses <i>vosotros</i> (you all, informal).</p>`},
{h:'Ir a + verb · hay · irregular “yo”',b:`<h4>The easy future: ir a + infinitive</h4><p>Conjugate <b>ir</b> and add <b>a</b> + any verb:</p>${TB('ir|example;voy|Voy a comer. (I’m going to eat.);vas|¿Vas a venir? (Are you coming?);va|Va a llover. (It’s going to rain.);vamos|Vamos a ver. (Let’s see.);van|Van a llamar. (They’re going to call.)')}<p><b>Vamos a…</b> also means “let’s…”: <i>¡Vamos a bailar!</i></p><h4>Hay = there is / there are</h4><p>One word for both: <i>Hay un problema. Hay tres clientes.</i> Question: <i>¿Hay agua?</i> Negative: <i>No hay tiempo.</i></p><h4>Irregular “yo” forms</h4><p>Many top verbs are only irregular in the yo form: <i>hago</i> (I do), <i>pongo</i> (I put), <i>salgo</i> (I leave), <i>tengo</i> (I have), <i>vengo</i> (I come), <i>digo</i> (I say), <i>sé</i> (I know), <i>conozco</i> (I know someone).</p>${W8('<i>Hay</i> never changes: <i>hay dos carros</i>, not “han dos carros”.')}`},
{h:'Questions · my, your, his',b:`<h4>Question words (always with an accent)</h4>${TB('Spanish|English|example;qué|what|¿Qué haces?;quién|who|¿Quién llama?;dónde|where|¿Dónde vives?;cuándo|when|¿Cuándo empiezas?;cómo|how|¿Cómo estás?;cuánto|how much|¿Cuánto cuesta?;cuál|which|¿Cuál prefieres?;por qué|why|¿Por qué lloras?')}<p><b>Por qué</b> (why) is two words with an accent. <b>Porque</b> (because) is one word: <i>¿Por qué estudias? Porque quiero trabajar.</i></p><h4>Yes / no questions</h4><p>Just raise your voice at the end: <i>¿Hablas español?</i> Written questions open with <b>¿</b>, exclamations with <b>¡</b>.</p><h4>My, your, his…</h4>${TB('one thing|two or more|meaning;mi|mis|my;tu|tus|your (friend);su|sus|his / her / your (polite) / their;nuestro / nuestra|nuestros / nuestras|our')}${W8('<i>Su</i> is ambiguous. When it matters, say <i>el carro de él</i> or <i>de usted</i>.')}`},
{h:'Present tense · telling time',b:`<h4>Regular present tense</h4><p>Remove -ar / -er / -ir and add:</p>${TB('|hablar|comer|vivir;yo|hablo|como|vivo;tú|hablas|comes|vives;él / ella / usted|habla|come|vive;nosotros|hablamos|comemos|vivimos;ellos / ustedes|hablan|comen|viven')}<p>The ending already tells you who, so the subject is usually dropped: <i>Trabajo en Makati</i> = I work in Makati.</p><p>The present also covers “I’m doing” and the near future: <i>Mañana trabajo</i> (I’m working tomorrow).</p><h4>Telling time</h4><p><i>¿Qué hora es?</i> → <i>Es la una. Son las dos. Son las tres y media</i> (3:30). <i>Son las cuatro menos cuarto</i> (3:45). At what time? <i>a las ocho</i>.</p>${W8('Use <i>es la</i> only for one o’clock. Everything else is <i>son las</i>.')}`},
{h:'Tener expressions · ordering food',b:`<h4>Feelings with tener</h4><p>Spanish says “I have hunger,” not “I am hungry”:</p>${TB('Spanish|English;tengo hambre|I’m hungry;tengo sed|I’m thirsty;tengo sueño|I’m sleepy;tengo frío / calor|I’m cold / hot;tengo prisa|I’m in a hurry;tengo miedo|I’m scared;tengo 25 años|I’m 25 years old;tengo que + verb|I have to…')}<h4>Ordering food</h4><p><i>Quisiera…</i> (I’d like…) and <i>Para mí, …</i> (For me, …) are the politest. <i>¿Me trae la cuenta?</i> (Can you bring the check?) · <i>¿Qué me recomienda?</i> (What do you recommend?) · <i>Sin azúcar, por favor.</i></p>${W8('Never “estoy 25 años”. Age always uses tener.')}`},
{h:'Adjectives · ser or estar + adjective',b:`<h4>Agreement</h4><p>Adjectives match the noun and usually go <b>after</b> it: <i>un carro rojo, una casa roja, dos casas rojas</i>.</p><p>Adjectives ending in -e or a consonant don’t change for gender: <i>un hombre amable, una mujer amable</i>.</p><h4>How much?</h4><p><i>un poco</i> (a bit) → <i>bastante</i> (quite) → <i>muy</i> (very) → <i>demasiado</i> (too).</p><h4>Ser or estar changes the meaning</h4>${TB('ser = nature|estar = current state;Es aburrido. (He’s boring.)|Está aburrido. (He’s bored.);Es listo. (He’s smart.)|Está listo. (He’s ready.);Es rico. (He’s rich.)|Está rico. (It’s delicious.)')}${W8('<i>bueno</i> and <i>malo</i> drop the -o before a masculine noun: <i>un buen día, un mal momento</i>.')}`},
{h:'Stem-changing verbs · places',b:`<h4>“Boot” verbs</h4><p>Some verbs change the vowel of their stem in every form except nosotros (and vosotros). Draw a boot around the changed forms and you’ll remember.</p>${TB('|e → ie|o → ue|e → i;|querer|poder|pedir;yo|quiero|puedo|pido;tú|quieres|puedes|pides;él / ella|quiere|puede|pide;nosotros|queremos|podemos|pedimos;ellos|quieren|pueden|piden')}<p>More: <i>pensar, empezar, entender, cerrar</i> (e→ie) · <i>volver, dormir, encontrar, recordar</i> (o→ue) · <i>seguir, repetir, servir</i> (e→i) · <i>jugar</i> (u→ue).</p><h4>Where is it?</h4><p><i>a la derecha</i> (on the right) · <i>a la izquierda</i> (left) · <i>derecho</i> (straight) · <i>al lado de</i> (next to) · <i>entre</i> (between) · <i>cerca de / lejos de</i> (near / far from).</p>${W8('<b>a + el = al</b> and <b>de + el = del</b>: <i>Voy al banco. Vengo del trabajo.</i>')}`},
{h:'Present progressive (right now)',b:`<h4>estar + -ando / -iendo</h4><p>Use it for what is happening at this moment.</p>${TB('verb|gerund|example;hablar|hablando|Estoy hablando con un cliente.;comer|comiendo|Estamos comiendo.;escribir|escribiendo|Está escribiendo un correo.;leer|leyendo|Estoy leyendo.;dormir|durmiendo|El bebé está durmiendo.;pedir|pidiendo|Está pidiendo ayuda.')}<p>Only <b>estar</b> changes; the -ndo word never does: <i>estoy, estás, está, estamos, están + trabajando</i>.</p><p>Thinking out loud: <i>Creo que…</i> (I think that…) · <i>Pienso que…</i> · <i>No sé si…</i> (I don’t know if…).</p>${W8('Don’t use it for the future like in English. “I’m leaving tomorrow” = <i>Salgo mañana</i> or <i>Voy a salir mañana</i>.')}`},
{h:'Gustar and friends',b:`<h4>Gustar works backwards</h4><p><i>Me gusta el café</i> literally means “coffee pleases me”. The verb agrees with the thing, not the person:</p>${TB('who|one thing|several things;me (I)|me gusta el té|me gustan los perros;te (you)|te gusta|te gustan;le (he / she / you)|le gusta|le gustan;nos (we)|nos gusta|nos gustan;les (they / you all)|les gusta|les gustan')}<p>With a verb, always singular: <i>Me gusta bailar.</i> Same pattern: <i>me encanta</i> (I love), <i>me duele</i> (it hurts), <i>me interesa</i> (it interests me), <i>me molesta</i> (it bothers me).</p><p>To clarify or stress: <i>A mí me gusta. A ella le gusta.</i></p>${W8('Not “yo gusto el café”. Say <i>Me gusta el café</i>.')}`},
{h:'Numbers & prices',b:`<h4>Numbers you’ll hear every day</h4>${TB('1–10|11–20|tens|hundreds;1 uno|11 once|30 treinta|100 cien;2 dos|12 doce|40 cuarenta|200 doscientos;3 tres|13 trece|50 cincuenta|300 trescientos;5 cinco|15 quince|60 sesenta|500 quinientos;7 siete|16 dieciséis|70 setenta|700 setecientos;9 nueve|20 veinte|90 noventa|1000 mil')}<p>From 31 use <b>y</b>: <i>treinta y uno, cuarenta y cinco</i>. 21–29 are one word: <i>veintidós, veintinueve</i>. 101+ use <b>ciento</b>: <i>ciento veinte</i>.</p><h4>Prices</h4><p><i>¿Cuánto cuesta?</i> (one thing) / <i>¿Cuánto cuestan?</i> (several) · <i>Son cincuenta pesos.</i> · <i>Es muy caro / barato.</i></p>${W8('<i>cien</i> alone, <i>ciento</i> + more: <i>cien pesos</i> but <i>ciento cinco pesos</i>.')}`},
{h:'Usted · formal Spanish',b:`<h4>When to use usted</h4><p>With customers, older people, bosses and strangers. It uses the <b>él / ella</b> verb form: <i>¿Usted tiene…? ¿Cómo está usted?</i> In Latin America <b>ustedes</b> is used for any group.</p><h4>Le = to you (formal)</h4><p><i>¿En qué puedo ayudarle?</i> (How can I help you?) · <i>Le envío un correo</i> (I’ll send you an email) · <i>Le explico</i> (Let me explain).</p>${TB('friend (tú)|customer (usted);¿Cómo estás?|¿Cómo está?;¿Tienes tu número?|¿Tiene su número?;Te ayudo.|Le ayudo.;Espera un momento.|Espere un momento.')}${W8('Don’t mix them in one call. Once you start with usted, keep <i>su</i> and <i>le</i> the whole time.')}`},
{h:'Preterite: finished past',b:`<h4>For finished actions</h4><p>Use it with <i>ayer, anoche, la semana pasada, el año pasado, hace dos días</i>.</p>${TB('|hablar|comer|vivir;yo|hablé|comí|viví;tú|hablaste|comiste|viviste;él / ella / usted|habló|comió|vivió;nosotros|hablamos|comimos|vivimos;ellos / ustedes|hablaron|comieron|vivieron')}<p>The accent matters: <i>hablo</i> = I speak, <i>habló</i> = he spoke.</p><h4>The big irregulars</h4><p><b>ser</b> and <b>ir</b> share the same past: <i>fui, fuiste, fue, fuimos, fueron</i>. <i>Fui al mercado</i> (I went) · <i>Fue increíble</i> (It was amazing).</p><p><i>tener → tuve · estar → estuve · hacer → hice (hizo) · poder → pude · decir → dije · ver → vi · dar → di</i></p>`},
{h:'Preterite irregulars',b:`<h4>Irregular stems (no accents!)</h4><p>These all take the same endings: <b>-e, -iste, -o, -imos, -ieron</b>.</p>${TB('verb|stem|yo|él / ella;tener|tuv-|tuve|tuvo;estar|estuv-|estuve|estuvo;poder|pud-|pude|pudo;poner|pus-|puse|puso;saber|sup-|supe|supo;querer|quis-|quise|quiso;venir|vin-|vine|vino;hacer|hic-|hice|hizo')}<p>j-stems drop the i in ellos: <i>decir → dije, dijeron · traer → traje, trajeron</i>.</p><h4>Spelling changes in “yo”</h4><p>-car → qué (<i>busqué</i>) · -gar → gué (<i>llegué, pagué</i>) · -zar → cé (<i>empecé</i>).</p><h4>-ir stem changes (él / ellos only)</h4><p><i>pedir → pidió, pidieron · dormir → durmió, durmieron · sentir → sintió</i>. Leer and creer use y: <i>leyó, creyó</i>.</p>`},
{h:'Reflexive verbs',b:`<h4>Things you do to yourself</h4><p>The verb comes with a pronoun that matches the subject:</p>${TB('|levantarse (to get up);yo|me levanto;tú|te levantas;él / ella / usted|se levanta;nosotros|nos levantamos;ellos / ustedes|se levantan')}<p>Almost every routine verb is reflexive: <i>despertarse, ducharse, vestirse, cepillarse, acostarse, dormirse</i>.</p><h4>Where does the pronoun go?</h4><p>Before a conjugated verb, or attached to an infinitive or -ndo form: <i>Me voy a duchar = Voy a ducharme. Me estoy vistiendo = Estoy vistiéndome.</i></p><p>Some change meaning: <i>dormir</i> (sleep) / <i>dormirse</i> (fall asleep) · <i>ir</i> (go) / <i>irse</i> (leave).</p>${W8('With body parts use <i>el / la</i>, not “mi”: <i>Me lavo las manos</i> (I wash my hands).')}`},
{h:'Future tense (will)',b:`<h4>Add the endings to the whole infinitive</h4>${TB('|hablar|comer|vivir;yo|hablaré|comeré|viviré;tú|hablarás|comerás|vivirás;él / ella|hablará|comerá|vivirá;nosotros|hablaremos|comeremos|viviremos;ellos|hablarán|comerán|vivirán')}<h4>Irregular stems (same endings)</h4><p><i>tener → tendré · poder → podré · salir → saldré · venir → vendré · poner → pondré · hacer → haré · decir → diré · querer → querré · saber → sabré</i></p><h4>Future vs ir a</h4><p>For plans in conversation, <i>voy a + infinitive</i> is more common. The future sounds more certain or formal: <i>Le llamaremos mañana</i> (We will call you tomorrow). It also makes guesses: <i>¿Dónde estará Ana?</i> (Where could Ana be?)</p>`},
{h:'Commands',b:`<h4>Telling people what to do</h4>${TB('|hablar|comer|escribir;tú|habla|come|escribe;usted|hable|coma|escriba;nosotros (let’s)|hablemos|comamos|escribamos;ustedes|hablen|coman|escriban;no + tú|no hables|no comas|no escribas')}<p>Trick: usted, ustedes and negative commands use the <b>opposite vowel</b> (-ar → e, -er/-ir → a), built from the yo form: <i>tengo → tenga, hago → haga, pido → pida</i>.</p><h4>Irregular tú commands</h4><p><i>di (decir) · haz (hacer) · ve (ir) · pon (poner) · sal (salir) · sé (ser) · ten (tener) · ven (venir)</i></p><p>Pronouns attach to positive commands: <i>Llámame. Siéntese.</i> They go before negative ones: <i>No me llames.</i></p>${W8('With customers always use usted commands + por favor: <i>Espere un momento, por favor.</i>')}`},
{h:'Imperfect: used to / was doing',b:`<h4>Habits and descriptions in the past</h4>${TB('|hablar|comer / vivir;yo|hablaba|comía;tú|hablabas|comías;él / ella|hablaba|comía;nosotros|hablábamos|comíamos;ellos|hablaban|comían')}<p>Only 3 irregulars: <b>ser</b> (era, eras, era, éramos, eran) · <b>ir</b> (iba, ibas, iba, íbamos, iban) · <b>ver</b> (veía…).</p><h4>When to use it</h4><p>Habits: <i>De niño, jugaba en la calle.</i> · Descriptions: <i>La casa era grande.</i> · Age and time: <i>Tenía diez años. Eran las tres.</i> · Ongoing actions: <i>Llovía.</i></p><p>Signal words: <i>antes, de niño, siempre, todos los veranos, a menudo, mientras</i>.</p>`},
{h:'Preterite vs imperfect',b:`<h4>Event vs background</h4>${TB('preterite = the event|imperfect = the scene;something happened|what was going on;Sonó el teléfono.|Llovía mucho.;Llegué a las ocho.|Eran las ocho.;Fui a Cebú el año pasado.|Iba a Cebú cada verano.')}<p>Together: <i>Estaba en la ducha cuando sonó el teléfono</i> (I was in the shower when the phone rang). The imperfect sets the scene; the preterite interrupts it.</p><p><b>Mientras</b> (while) usually takes the imperfect. <b>De repente</b> (suddenly) usually takes the preterite.</p><h4>Verbs that change meaning</h4><p><i>conocí</i> = I met / <i>conocía</i> = I knew · <i>supe</i> = I found out / <i>sabía</i> = I knew · <i>no quise</i> = I refused / <i>no quería</i> = I didn’t want.</p>`},
{h:'Object pronouns (lo, le, se lo)',b:`<h4>Direct objects: it, him, her, them</h4>${TB('English|masculine|feminine;it / him / her|lo|la;them|los|las')}<p><i>¿Tienes el libro? Sí, lo tengo. ¿Y las llaves? No las encuentro.</i></p><h4>Indirect objects: to / for someone</h4><p><i>me</i> (to me) · <i>te</i> · <i>le</i> (to him / her / you) · <i>nos</i> · <i>les</i> (to them / you all): <i>Le di el dinero</i> (I gave him the money).</p><h4>Both together</h4><p>Indirect goes first, and <b>le / les becomes se</b> before lo / la: <i>Se lo doy</i> (I give it to him), never “le lo”. <i>¿Me lo prestas? Sí, te lo presto.</i></p>${W8('Position: before the conjugated verb, or attached to infinitives, -ndo forms and positive commands: <i>Te lo voy a dar = Voy a dártelo.</i>')}`},
{h:'Comparisons',b:`<h4>More, less, as… as</h4>${TB('pattern|example;más + adj + que|Ana es más alta que yo.;menos + adj + que|Es menos caro que el otro.;tan + adj + como|Soy tan rápido como tú.;tanto/a/os/as + noun + como|No tengo tanto dinero como él.;verb + tanto como|No trabajo tanto como tú.')}<h4>Irregular forms</h4><p><i>bueno → mejor</i> (better) · <i>malo → peor</i> (worse) · <i>viejo → mayor</i> (older, people) · <i>joven → menor</i> (younger).</p><h4>The most</h4><p><i>el / la más + adj + de</i>: <i>Es el restaurante más caro de la ciudad.</i> Super-: add -ísimo: <i>rico → riquísimo, caro → carísimo</i>.</p>${W8('Not “más mejor”. Just <i>mejor</i>.')}`},
{h:'At the doctor · how long · obligation',b:`<h4>Describing symptoms</h4><p><i>Me duele la cabeza</i> (my head hurts) / <i>Me duelen los pies</i> (my feet hurt) · <i>Tengo fiebre, tos, gripe, un resfriado.</i> · <i>Me siento mareado.</i></p><h4>How long: hace + time + que</h4><p><i>Hace tres días que tengo tos</i> = I’ve had a cough for three days. Question: <i>¿Cuánto tiempo hace que…?</i></p><h4>Obligation</h4>${TB('phrase|strength|example;tener que|you must|Tienes que descansar.;hay que|one must (general)|Hay que tomar mucha agua.;deber|you should / must|Debes ir al médico.;debería|you should (softer)|Deberías dormir más.')}<p>At the pharmacy: <i>¿Tiene algo para el dolor de garganta?</i></p>`},
{h:'This & that · in the store',b:`<h4>Demonstratives</h4>${TB('|near me|near you|far away;masculine|este|ese|aquel;feminine|esta|esa|aquella;plural|estos / estas|esos / esas|aquellos / aquellas')}<p>Without a noun they mean “this one / that one”: <i>Quiero este, no ese.</i> For ideas use <i>esto, eso</i>: <i>¿Qué es eso?</i></p><h4>In the store</h4><p><i>¿Me lo puedo probar?</i> (Can I try it on?) · <i>¿Tiene una talla más grande?</i> · <i>Me queda grande / pequeño / bien</i> · <i>¿Aceptan tarjeta?</i> · <i>¿Está en oferta?</i></p>${W8('<i>Quedar</i> works like gustar: <i>Los zapatos me quedan pequeños.</i>')}`},
{h:'Weather & seasons',b:`<h4>Hacer, estar, hay</h4>${TB('verb|weather;hace …|calor, frío, sol, viento, buen / mal tiempo;está …|nublado, soleado, despejado (clear);hay …|tormenta, niebla (fog), mucha humedad;on its own|llueve (it rains), está lloviendo, va a llover')}<p>Past: <i>Ayer hizo mucho calor</i> (the whole day, finished) / <i>Hacía calor cuando salí</i> (background).</p><p>Seasons: <i>la primavera, el verano, el otoño, el invierno</i>. In the Philippines: <i>la temporada de lluvias</i> and <i>la temporada seca</i>.</p>${W8('Not “es calor”. Weather uses <i>hace</i>: <i>Hace calor</i>. For your body it’s tener: <i>Tengo calor</i>.')}`},
{h:'Giving opinions',b:`<h4>Saying what you think</h4><p><i>Creo que… · Pienso que… · Me parece que… · En mi opinión… · Para mí…</i> all take the normal verb: <i>Creo que es buena idea.</i></p><h4>Agreeing & disagreeing</h4>${TB('agree|disagree;Estoy de acuerdo.|No estoy de acuerdo.;Tienes razón.|No tienes razón.;¡Claro! / ¡Exacto!|¡Para nada! / ¡Qué va!;Yo también.|Yo no.;A mí también. (with gustar)|A mí no.')}<p><b>Tampoco</b> = neither: <i>No me gusta. — A mí tampoco.</i></p><p>Balancing: <i>por un lado… por otro lado… · depende · la verdad es que…</i></p>`},
{h:'Present perfect (have done)',b:`<h4>haber + participle</h4>${TB('haber|participle;he|-ar → -ado (hablado);has|-er → -ido (comido);ha|-ir → -ido (vivido);hemos|;han|')}<p>Use it for life experiences and for time periods that aren’t over: <i>hoy, esta semana, este año, alguna vez, nunca, ya, todavía no</i>.</p><h4>Irregular participles</h4><p><i>hacer → hecho · decir → dicho · ver → visto · escribir → escrito · poner → puesto · volver → vuelto · abrir → abierto · romper → roto · morir → muerto · resolver → resuelto</i></p><p><i>¿Alguna vez has comido balut? — No, nunca lo he probado.</i></p>${W8('Nothing goes between haber and the participle: <i>Ya lo he hecho</i>, not “he lo hecho”. Note: much of Latin America uses the preterite here instead: <i>¿Ya comiste?</i>')}`},
{h:'Talking about your job · how long',b:`<h4>Describing your work</h4><p><i>Trabajo como agente</i> (I work as an agent) · <i>Trabajo en una empresa de telecomunicaciones</i> · <i>Me encargo de…</i> (I’m in charge of…) · <i>Mi horario es de diez a siete.</i></p><h4>“I’ve been doing it for…”</h4>${TB('pattern|example;llevar + time|Llevo dos años aquí.;hace + time + que + present|Hace dos años que trabajo aquí.;present + desde hace + time|Trabajo aquí desde hace dos años.')}<p>All three mean “I’ve been working here for two years.” Spanish uses the <b>present</b> here, not the perfect.</p><p>In an interview: <i>Tengo experiencia en servicio al cliente. Soy responsable y puntual. Me gusta resolver problemas.</i></p>`},
{h:'Conditional (would)',b:`<h4>Infinitive + -ía</h4>${TB('|hablar|comer|vivir;yo|hablaría|comería|viviría;tú|hablarías|comerías|vivirías;él / ella|hablaría|comería|viviría;nosotros|hablaríamos|comeríamos|viviríamos;ellos|hablarían|comerían|vivirían')}<p>Same irregular stems as the future: <i>tendría, podría, saldría, vendría, pondría, haría, diría, querría, sabría</i>.</p><h4>The polite tense</h4><p><i>¿Podría ayudarme?</i> (Could you help me?) · <i>Me gustaría…</i> (I’d like…) · <i>¿Le importaría…?</i> (Would you mind…?) · <i>Deberías descansar</i> (You should rest) · <i>En tu lugar, lo haría.</i></p>${W8('For “would” meaning a past habit, use the imperfect: “We would go to the beach every summer” = <i>Íbamos a la playa cada verano.</i>')}`},
{h:'Por vs para',b:`<h4>Para = goal, destination, deadline, recipient</h4><p><i>Estudio <b>para</b> aprender</i> (in order to) · <i>Salgo <b>para</b> Cebú</i> (destination) · <i>Es <b>para</b> el lunes</i> (deadline) · <i>Es <b>para</b> ti</i> (recipient) · <i><b>Para</b> mí, …</i> (in my opinion)</p><h4>Por = cause, route, means, time, exchange</h4><p><i>Gracias <b>por</b> todo</i> (cause) · <i>Caminamos <b>por</b> el parque</i> (through) · <i>Hablamos <b>por</b> teléfono</i> (means) · <i><b>por</b> la mañana</i> (part of the day) · <i>Lo compré <b>por</b> 100 pesos</i> (exchange)</p>${TB('quick test|use;Why? because of…|por;What for? purpose / goal|para;through · by · per · in exchange|por;toward · by (a date) · for (someone)|para')}${W8('<i>Trabajo para Google</i> (my employer) vs <i>Trabajo por mi familia</i> (for the sake of my family).')}`},
{h:'Present subjunctive: wishes & advice',b:`<h4>How to form it: the opposite vowel</h4><p>Take the <b>yo</b> form, drop the -o, and switch the vowel: -ar verbs take <b>e</b>, -er / -ir verbs take <b>a</b>.</p>${TB('|hablar|comer|tener (tengo);yo|hable|coma|tenga;tú|hables|comas|tengas;él / ella|hable|coma|tenga;nosotros|hablemos|comamos|tengamos;ellos|hablen|coman|tengan')}<p>Irregular: <i>ser → sea · ir → vaya · estar → esté · dar → dé · saber → sepa · haber → haya</i>.</p><h4>When: wanting someone else to do something</h4><p>Wish / advice + <b>que</b> + a <b>different</b> person: <i>Quiero <b>que</b> vengas</i> (I want you to come). Same with <i>espero que, necesito que, te recomiendo que, es importante que, ojalá (que)</i>.</p>${W8('Same person = infinitive: <i>Quiero venir</i> (I want to come), not “quiero que yo venga”.')}`},
{h:'Subjunctive with feelings',b:`<h4>Reacting to what others do</h4><p>When you express a feeling about someone else’s action, that second verb goes in the subjunctive:</p>${TB('emotion|example;me alegra que|Me alegra que estés bien.;siento que|Siento que no puedas venir.;me molesta que|Me molesta que llegues tarde.;me preocupa que|Me preocupa que no comas.;es una pena que|Es una pena que te vayas.;tengo miedo de que|Tengo miedo de que llueva.')}<p>If the feeling is about yourself, use the infinitive: <i>Me alegra estar aquí</i> (I’m glad to be here).</p><p>Feelings with estar: <i>orgulloso, emocionado, decepcionado, harto, agradecido</i>.</p>`},
{h:'Doubt vs certainty',b:`<h4>Sure → normal verb · not sure → subjunctive</h4>${TB('indicative (sure)|subjunctive (not sure);Creo que es verdad.|No creo que sea verdad.;Estoy seguro de que viene.|No estoy seguro de que venga.;Es cierto que llueve.|Es posible que llueva.;Es obvio que está cansado.|Dudo que esté cansado.')}<p>Possibility always takes subjunctive: <i>es posible que, es probable que, puede ser que</i>. <i>Quizás / tal vez</i> can take either; the subjunctive sounds less sure.</p><p><i>A lo mejor</i> (maybe) always takes the normal verb: <i>A lo mejor viene mañana.</i></p>`},
{h:'Pluperfect (had done)',b:`<h4>había + participle</h4>${TB('haber (imperfect)|participle;había|hablado;habías|comido;había|salido;habíamos|hecho;habían|visto')}<p>Use it for something that happened <b>before</b> another past moment: <i>Cuando llegué, la reunión ya había empezado</i> (When I arrived, the meeting had already started).</p><p>Common partners: <i>ya</i> (already) · <i>todavía no</i> (not yet) · <i>nunca antes</i>: <i>Nunca había visto el mar.</i></p><h4>Before / after doing</h4><p><i>antes de + infinitive</i> · <i>después de + infinitive</i>: <i>Después de comer, me fui.</i></p>`},
{h:'Impersonal se · tech instructions',b:`<h4>Se = people in general, “you”, “one”</h4><p><i>¿Se puede pagar con tarjeta?</i> (Can you pay by card?) · <i>Aquí se habla español.</i> · <i>¿Cómo se dice…?</i></p><p>The verb agrees with the thing: <i>Se vende carro</i> / <i>Se venden carros</i>.</p><h4>Step-by-step instructions (usted)</h4><p><i>Haga clic en… · Ingrese su contraseña · Reinicie el equipo · Descargue la aplicación · Espere unos segundos.</i></p>${TB('step|connector;first|Primero, …;then|Luego / Después, …;next|A continuación, …;finally|Por último, …')}`},
{h:'Travel · acabar de · going vs leaving',b:`<h4>Just did: acabar de + infinitive</h4><p><i>Acabo de llegar</i> = I’ve just arrived. <i>Acabamos de comer.</i> In the past: <i>Acababa de salir cuando llamaste</i> (I had just left when you called).</p><h4>Going, leaving, arriving</h4><p><i>ir</i> = to go somewhere · <i>irse</i> = to leave · <i>salir</i> = to go out / depart · <i>llegar</i> = to arrive: <i>El vuelo sale a las seis y llega a las diez.</i></p><h4>At the airport and hotel</h4><p><i>Tengo una reserva a nombre de… · ¿A qué hora es el check-in? · ¿Dónde está la puerta de embarque? · Mi maleta no llegó. · ¿El desayuno está incluido?</i></p>`},
{h:'Connectors: make your Spanish flow',b:`<h4>Linking words by purpose</h4>${TB('purpose|connectors;add|además, también, incluso (even);contrast|pero, sin embargo, aunque, en cambio, mientras que;cause|porque, ya que, como (at the start), debido a;result|así que, por eso, por lo tanto, entonces;order|primero, luego, después, por último;explain|es decir, o sea, por ejemplo;sum up|en resumen, en conclusión, al final')}<p><b>Aunque</b> + normal verb = although (a fact): <i>Aunque llueve, salgo.</i> + subjunctive = even if: <i>Aunque llueva, saldré.</i></p>${W8('<i>Pero</i> vs <i>sino</i>: after a negative, use <i>sino</i> to correct: <i>No es rojo sino azul.</i>')}`},
{h:'Handling problems professionally',b:`<h4>The 4-step problem call</h4><p>1. <b>Empathize</b>: <i>Lamento mucho lo sucedido. Entiendo su frustración.</i><br>2. <b>Verify</b>: <i>Permítame revisar su cuenta.</i><br>3. <b>Solve</b>: <i>Lo que puedo hacer es… / Le voy a ofrecer…</i><br>4. <b>Confirm</b>: <i>¿Hay algo más en lo que pueda ayudarle?</i></p><h4>Soft recommendations (subjunctive)</h4><p><i>Le recomiendo que reinicie el módem. Le sugiero que guarde su número de caso. Es importante que revise su correo.</i></p><h4>Saying no politely</h4><p><i>Lamentablemente, no es posible… · Según nuestra política… · Sin embargo, sí puedo…</i></p>`},
{h:'Imperfect subjunctive · “if” sentences',b:`<h4>Form: ellos preterite − ron + ra</h4>${TB('preterite (ellos)|imperfect subjunctive;hablaron|hablara, hablaras, habláramos;comieron|comiera, comieras, comiéramos;tuvieron|tuviera, tuvieras, tuviéramos;fueron|fuera (ser and ir);pudieron|pudiera;dijeron|dijera')}<h4>Unreal conditions</h4><p><b>Si + imperfect subjunctive, conditional</b>: <i>Si tuviera dinero, viajaría</i> (If I had money, I’d travel) · <i>Si fuera tú, no lo haría.</i></p><p>Also after a past or polite main verb: <i>Quería que vinieras. Me pidió que esperara. Me gustaría que me llamaras.</i> Wishes: <i>Ojalá tuviera más tiempo</i> (I wish I had more time). <i>Como si</i> (as if) always takes it.</p>${W8('Never use the conditional after si: “si tendría” is wrong; say <i>si tuviera</i>.')}`},
{h:'Subjunctive after when, until, so that',b:`<h4>Not happened yet = subjunctive</h4><p>After <i>cuando, en cuanto, hasta que, después de que, tan pronto como</i>, use the subjunctive if the action is still in the future:</p>${TB('future (subjunctive)|habit or past (normal);Cuando llegues, llámame.|Cuando llego, te llamo.;Espera hasta que vuelva.|Esperé hasta que volvió.;En cuanto pueda, te aviso.|En cuanto pude, te avisé.')}<h4>Always subjunctive</h4><p><i>para que</i> (so that) · <i>antes de que</i> (before) · <i>sin que</i> (without) · <i>a menos que</i> (unless) · <i>con tal de que</i> (as long as): <i>Te lo explico para que lo entiendas.</i></p>`},
{h:'Reported speech',b:`<h4>Shifting tenses back</h4><p>When you report what someone said, the tenses usually move one step into the past:</p>${TB('they said|you report;«Estoy cansado.»|Dijo que estaba cansado.;«Llegué tarde.»|Dijo que había llegado tarde.;«Llamaré mañana.»|Dijo que llamaría al día siguiente.;«Voy a ir.»|Dijo que iba a ir.;«Llama al cliente.»|Me dijo que llamara al cliente.')}<p>Questions: <i>«¿Tienes hambre?»</i> → <i>Me preguntó <b>si</b> tenía hambre.</i> · <i>«¿Dónde vives?»</i> → <i>Me preguntó dónde vivía.</i></p><p>Time words change too: <i>hoy → ese día · mañana → al día siguiente · ayer → el día anterior</i>.</p>`},
{h:'Se: passive and accidents',b:`<h4>Passive se</h4><p><i>Se venden casas. Se necesitan agentes. No se permite fumar.</i> The thing is the subject; nobody is named.</p><p>The formal passive is <i>ser + participle</i>: <i>El edificio fue construido en 1990.</i></p><h4>No-fault se (accidents)</h4><p>Spanish blames the object, not you: <b>se + me / te / le + verb + thing</b>.</p>${TB('Spanish|English;Se me olvidó.|I forgot (it slipped my mind).;Se me cayó el vaso.|I dropped the glass.;Se me rompió la pantalla.|My screen broke.;Se le perdieron las llaves.|He lost his keys.;Se nos acabó el tiempo.|We ran out of time.')}<p>The verb agrees with the thing: <i>se me cayó</i> (one thing) / <i>se me cayeron</i> (several).</p>`},
{h:'Verb phrases & idioms',b:`<h4>Verb + verb combos</h4>${TB('phrase|meaning|example;volver a + inf|do again|Volví a llamar.;dejar de + inf|stop doing|Dejé de fumar.;seguir + -ndo|keep doing|Sigo estudiando.;llevar + time + -ndo|have been doing|Llevo una hora esperando.;acabar de + inf|have just done|Acabo de llegar.;estar a punto de|be about to|Estoy a punto de salir.;ponerse a + inf|start doing|Se puso a llorar.')}<h4>Three ways to “become”</h4><p><i>ponerse</i> + feeling (sudden): <i>se puso rojo</i> · <i>volverse</i> (lasting change): <i>se volvió famoso</i> · <i>hacerse</i> (by effort): <i>se hizo médico</i>.</p><p>Natives use idioms constantly. Learn them as whole chunks: <i>echar de menos, valer la pena, meter la pata, no tener ni idea, tomar el pelo</i>.</p>`},
{h:'Relative words · lo + adjective',b:`<h4>Joining ideas into one sentence</h4>${TB('word|use|example;que|who / that / which (most common)|El cliente que llamó…;quien|who (after a comma or preposition)|La chica con quien hablé…;lo que|what / the thing that|Lo que quiero es…;donde|where|La ciudad donde vivo…;cuyo / cuya|whose|El hombre cuyo carro…')}<h4>Lo + adjective = “the … thing”</h4><p><i>Lo bueno es que… · Lo malo es que… · Lo importante es… · Lo mejor fue…</i> A very natural way to organize opinions.</p><h4>Discussing big topics</h4><p><i>Hoy en día… · Por un lado… por otro lado… · En mi opinión… · Es fundamental que + subjunctive</i>: <i>Es fundamental que cuidemos el medio ambiente.</i></p>`}];

const mkDeck=(k,t,e,txt,tip,lv='A1')=>{const d={k,t,e,tip,lv,items:txt.trim().split('\n').map(l=>{const[es,en]=l.split('|');const it={id:k+':'+es,es,en,ty:'p',d:t};BYID[it.id]=it;return it})};DECKS.push(d);return d};

{t:'Mi día',lv:'A1',es:'Me llamo Carlos y [vivo] en Manila. Todos los días me [levanto] a las seis. [Tomo] un café y [como] pan. Después, [voy] al trabajo en autobús. Trabajo en una oficina [grande]. Por la noche, [ceno] con mi familia.',en:'My name is Carlos and I [live] in Manila. Every day I [get] up at six. I [drink] a coffee and [eat] bread. Then I [go] to work by bus. I work in a [big] office. At night, I have [dinner] with my family.'},
{t:'En el restaurante',lv:'A1',es:'Hoy [estoy] en un restaurante con mi [amiga] Ana. Ella [quiere] pollo con arroz. Yo [pido] una sopa. La comida está muy [rica]. Al final, digo: «La [cuenta], por favor».',en:'Today I [am] at a restaurant with my [friend] Ana. She [wants] chicken with rice. I [order] a soup. The food is very [delicious]. At the end, I say: “The [check], please.”'},

{t:'En la tienda',lv:'A1',es:'—Buenas tardes. ¿Cuánto [cuesta] esta camisa?\n—Cuesta veinte dólares.\n—Es un poco [cara]. ¿Hay [descuento]?\n—Sí, hoy hay un descuento del diez por ciento.\n—¡Perfecto! Voy a [pagar] con [tarjeta].',en:'—Good afternoon. How much [does] this shirt cost?\n—It costs twenty dollars.\n—It’s a little [expensive]. Is there a [discount]?\n—Yes, today there’s a ten percent discount.\n—Perfect! I’m going to [pay] by [card].'},
{t:'El clima',lv:'A1',es:'Hoy [hace] mucho calor en Manila. El sol está muy [fuerte]. Mañana va a [llover] mucho. Por eso [necesito] un paraguas. En diciembre, el clima es más [fresco].',en:'Today it’s very [hot] in Manila. The sun is very [strong]. Tomorrow it’s going to [rain] a lot. That’s [why] I need an umbrella. In December, the weather is [cooler].'},
{t:'El fin de semana pasado',lv:'A2',es:'El sábado pasado [fui] a la playa con mis amigos. [Salimos] muy temprano. En la playa, [nadamos] y [comimos] mangos. Por la tarde, mi amigo [tocó] la guitarra. [Volvimos] a casa muy cansados, pero [felices].',en:'Last Saturday I [went] to the beach with my friends. We [left] very early. At the beach, we [swam] and [ate] mangoes. In the afternoon, my friend [played] the guitar. We [came] back home very tired, but [happy].'},
{t:'Ayer en el trabajo',lv:'A2',es:'Ayer [llegué] tarde al trabajo porque [hubo] mucho tráfico. Mi jefe no [dijo] nada. [Hablé] con quince clientes y [resolví] muchos problemas. Al final del turno, [tomé] un café con mi equipo.',en:'Yesterday I [arrived] late to work because there [was] a lot of traffic. My boss didn’t [say] anything. I [talked] to fifteen customers and [solved] a lot of problems. At the end of the shift, I [had] a coffee with my team.'},
{t:'Mis planes',lv:'A2',es:'El próximo año [voy] a viajar a México. [Visitaré] a mi tía en Guadalajara. Allí [hablaré] español todos los días. También [comeré] tacos y [conoceré] a mucha gente. ¡[Será] un viaje increíble!',en:'Next year I’m [going] to travel to Mexico. I [will] visit my aunt in Guadalajara. There I will [speak] Spanish every day. I will also [eat] tacos and I will [meet] a lot of people. It will be an [amazing] trip!'},
{t:'Una llamada de trabajo',lv:'A2',es:'—Buenos días, gracias por [llamar]. ¿En qué puedo [ayudarle]?\n—Hola, tengo un [problema] con mi factura.\n—Lo siento. ¿Me da su número de [cuenta]?\n—Sí, es el 4521.\n—Gracias. Un [momento], por favor. Ya veo el error. Voy a [cancelar] el cargo extra.',en:'—Good morning, thank you for [calling]. How can I [help] you?\n—Hi, I have a [problem] with my bill.\n—I’m sorry. Can you give me your [account] number?\n—Yes, it’s 4521.\n—Thank you. One [moment], please. I see the error now. I’m going to [cancel] the extra charge.'},
{t:'Mi amiga Sofía',lv:'A2',es:'Sofía es mi mejor [amiga]. La [conocí] en la universidad hace cinco años. Ahora ella [vive] en Cebú, pero [hablamos] por teléfono cada semana. El próximo mes [iré] a visitarla. ¡[Estoy] muy emocionado!',en:'Sofía is my best [friend]. I [met] her at the university five years ago. Now she [lives] in Cebu, but we [talk] on the phone every week. Next month I [will] go visit her. I’m very [excited]!'},
{t:'Una mañana difícil',lv:'B1',es:'Esta mañana [perdí] el autobús y [tuve] que caminar. Luego [empezó] a llover. Cuando [llegué] a la oficina, el sistema [estuvo] lento toda la mañana. Pero mi compañero me [ayudó] y todo salió bien.',en:'This morning I [missed] the bus and I [had] to walk. Then it [started] to rain. When I [arrived] at the office, the system [was] slow all morning. But my coworker [helped] me and everything turned out fine.'}];

const WBLES={
'Adverbs':{h:'How adverbs work',b:`<h4>What they do</h4><p>Adverbs answer <b>when, where, how, how often</b> and <b>how much</b>. They never change for gender or plural: <i>Ellas hablan rápido.</i></p><h4>Make your own: adjective + -mente</h4><p>Take the <b>feminine</b> form and add -mente: <i>rápida → rápidamente, clara → claramente</i>. No feminine form? Just add it: <i>fácil → fácilmente</i> (the accent stays).</p><p>Two in a row: only the last one gets -mente: <i>Habla clara y lentamente.</i></p><h4>Where they go</h4><p>Usually right after the verb: <i>Trabajo mucho.</i> Time and frequency words can open the sentence: <i>Siempre llego temprano. Mañana trabajo.</i></p><h4>Double negatives are correct</h4><p>If <i>nunca, nada, nadie, tampoco</i> come <b>after</b> the verb, put <i>no</i> before it: <i>No como nunca carne.</i> If they come first, no <i>no</i>: <i>Nunca como carne.</i></p>${W8('<b>bien</b> (well) says how you do something; <b>bueno</b> (good) describes a noun: <i>Hablas bien. Es un buen libro.</i> Same with <b>mal</b> / <b>malo</b>.')}`},
'Pronouns & questions':{h:'Pronouns & question words',b:`<h4>Subject pronouns are optional</h4><p>The verb ending already says who: <i>Trabajo</i> = I work. Use <i>yo, tú, él…</i> for emphasis or contrast: <i>Yo trabajo, él no.</i></p><h4>Object pronouns</h4>${TB('|direct (it / him)|indirect (to him)|reflexive;yo|me|me|me;tú|te|te|te;él / ella / usted|lo / la|le (se)|se;nosotros|nos|nos|nos;ellos / ustedes|los / las|les (se)|se')}<h4>After a preposition</h4><p><i>para mí, para ti</i>, but <i>conmigo, contigo</i>. Everyone else uses the normal form: <i>para él, con usted, sin ellos</i>.</p><h4>This, that, that over there</h4><p><i>este</i> (near me) · <i>ese</i> (near you) · <i>aquel</i> (far from both). For unknown things or ideas: <i>esto, eso, aquello</i>: <i>¿Qué es eso?</i></p><h4>¿Qué? or ¿Cuál?</h4><p>Use <b>¿cuál?</b> to pick from options and before <b>es / son</b> + noun: <i>¿Cuál es tu nombre? ¿Cuál es su número?</i> Use <b>¿qué?</b> before a noun or for definitions: <i>¿Qué color? ¿Qué es esto?</i></p>${W8('“¿Qué es tu número?” sounds wrong to natives. Say <i>¿Cuál es tu número?</i>')}`},
'Prepositions & conjunctions':{h:'Prepositions & connectors',b:`<h4>The big three: a, en, de</h4>${TB('word|main idea|examples;a|to · at (a time)|Voy a Cebú. A las tres.;en|in · on · at (a place) · by (transport)|Estoy en casa. En autobús.;de|of · from · ’s (owner)|Soy de Manila. El carro de Ana.')}<h4>Contractions</h4><p><b>a + el = al</b>, <b>de + el = del</b>: <i>Voy al banco. Vengo del trabajo.</i> Not with the pronoun él: <i>de él</i>.</p><h4>Place words take “de” before a noun</h4><p><i>Está cerca.</i> (It’s near.) / <i>Está cerca <b>del</b> parque.</i> Same for <i>lejos de, encima de, delante de, detrás de, antes de, después de</i>.</p><h4>Verbs with fixed partners</h4><p><i>pensar <b>en</b> · depender <b>de</b> · casarse <b>con</b> · soñar <b>con</b> · enamorarse <b>de</b> · acordarse <b>de</b> · empezar <b>a</b> · tratar <b>de</b> · acabar <b>de</b></i></p><h4>Small sound changes</h4><p><b>y → e</b> before i- / hi-: <i>padre e hijo</i>. <b>o → u</b> before o- / ho-: <i>siete u ocho</i>.</p>${W8('After a negative, correct with <b>sino</b>, not pero: <i>No es caro sino barato.</i>')}`},
'Expressions & reactions':{h:'Sound natural: reactions & fillers',b:`<h4>Why they matter</h4><p>Native speakers react all the time: <i>¡Qué bien! ¡No me digas! ¡Qué pena!</i> Using them makes you sound fluent long before your grammar is perfect.</p><h4>The ¡Qué…! pattern</h4><p>¡Qué + adjective / noun! works with almost anything: <i>¡Qué bonito! ¡Qué calor! ¡Qué rico!</i> Add more: <i>¡Qué día tan largo!</i> (What a long day!)</p><h4>Que + subjunctive = good wishes</h4><p><i>¡Que te vaya bien! ¡Que descanses! ¡Que te mejores! ¡Que tengas un buen día!</i></p><h4>Formal or informal</h4><p><i>oye, mira, disculpa</i> (tú) vs <i>oiga, mire, disculpe</i> (usted).</p>${W8('Regional words like <i>vale</i> (Spain), <i>ándale</i> (Mexico) or <i>chévere</i> (Colombia, Venezuela) are understood widely, but they mark where you learned your Spanish.')}`},
'Describing words':{h:'Adjectives: agreement & position',b:`<h4>Agreement</h4><p>-o / -a / -os / -as: <i>un carro rojo, una casa roja</i>. Ending in -e or a consonant: only plural changes: <i>amable → amables, azul → azules</i>. Nationalities ending in a consonant add -a: <i>español → española, japonés → japonesa</i>.</p><h4>Position can change the meaning</h4>${TB('before the noun|after the noun;un gran hombre (a great man)|un hombre grande (a big man);un viejo amigo (an old friend, for years)|un amigo viejo (an elderly friend);¡Pobre hombre! (unlucky man)|un hombre pobre (a man with no money)')}<h4>Short forms</h4><p>Before a masculine singular noun: <i>bueno → buen, malo → mal, alguno → algún, ninguno → ningún, primero → primer</i>. <i>grande → gran</i> before any singular noun.</p>`},
'Topic words':{h:'Nouns: gender, plurals & tricks',b:`<h4>Learn every noun with el or la</h4><p>Masculine: usually <b>-o, -or, -aje</b> and Greek <b>-ma</b> words. Feminine: usually <b>-a, -ción, -sión, -dad, -tad, -tud, -umbre</b>.</p><h4>Famous surprises</h4><p><i>el día, el mapa, el problema, el sistema, el idioma, el clima</i> · <i>la mano, la foto, la moto, la radio</i> · <i>la gente</i> (singular!) · <i>la persona</i> (even for a man).</p><h4>El agua, but feminine</h4><p>Feminine nouns that start with a stressed “a” sound take <b>el</b> in the singular: <i>el agua fría, el hambre, el águila</i>. Plural is normal: <i>las aguas</i>.</p><h4>Plurals</h4><p>vowel + s (<i>casa → casas</i>) · consonant + es (<i>ciudad → ciudades</i>) · z → ces (<i>lápiz → lápices, luz → luces</i>) · accents can move: <i>canción → canciones, examen → exámenes</i>.</p><h4>Days & months</h4><p>Lowercase. Days take el: <i>el lunes</i> (on Monday), <i>los lunes</i> (on Mondays). Months usually need no article: <i>en mayo</i>.</p>`},
'Culture':{h:'Slang & regional words',b:`<p>Spanish is one language with many local flavors. Slang changes from country to country, and sometimes from city to city. Learn to <b>recognize</b> lots of it, then <b>use</b> the slang of the people you talk to most.</p>${W8('Slang is informal. Never use it with customers, bosses or on formal calls: stick to standard Spanish and usted.')}`},
'Special':{h:'Tricky words',b:`<p>These decks collect words that trip up learners: <b>false friends</b> (look like English but mean something else) and <b>Spanish words hidden in Tagalog</b>, which you probably already know.</p>`}};

/* ================= why Spanish works the way it does ================= */
const LOGIC=[
{t:'Spanish is spelled the way it sounds',e:'🔤',b:`<p>English spelling is chaotic (though, tough, through). Spanish is almost perfectly consistent: each letter has one sound, and the 5 vowels <b>a e i o u</b> never change. Once you know the letters, you can pronounce any word you read, and spell almost any word you hear.</p><p>That’s why the pronunciation guide below is worth 10 minutes: it unlocks reading <i>everything</i>.</p>`},
{t:'Where the stress goes, and why accents exist',e:'🎯',b:`<p>Spanish has two simple stress rules:</p><p>1. Words ending in a <b>vowel, n or s</b> stress the <b>second-to-last</b> syllable: <i>CA-sa, HA-blan, ZA-pa-tos</i>.<br>2. Words ending in <b>any other consonant</b> stress the <b>last</b> syllable: <i>ha-BLAR, ciu-DAD, re-LOJ</i>.</p><p>A written accent means “this word breaks the rule”: <i>ca-FÉ, ÁR-bol, te-LÉ-fo-no, can-CIÓN</i>. So the accent tells you exactly how to say it.</p><p>Accents also separate look-alike words: <i>tú</i> (you) / <i>tu</i> (your) · <i>él</i> (he) / <i>el</i> (the) · <i>sí</i> (yes) / <i>si</i> (if) · <i>más</i> (more) / <i>mas</i> (but) · <i>qué</i> (what?) / <i>que</i> (that).</p>`},
{t:'Why you can drop yo, tú, él',e:'✂️',b:`<p>In English, “speak” could be I, you, we or they, so you must say who. In Spanish the ending already tells you: <i>hablo</i> can only be “I speak”. So the subject pronoun is usually dropped: <i>Trabajo en Makati.</i></p><p>You add it for <b>emphasis or contrast</b>: <i>Yo pago, tú no.</i> (I’m paying, not you.)</p>`},
{t:'Why two verbs for “to be”',e:'🪨',b:`<p>Both come from Latin. <b>Ser</b> comes from <i>esse</i> (“to be”): what something <i>is</i> at its core. <b>Estar</b> comes from <i>stare</i> (“to stand”): how or where something <i>stands</i> right now.</p><p>So ask: is this <b>what it is</b> (identity, origin, job, personality, time) or <b>how / where it is</b> right now (location, mood, condition)? <i>Soy feliz</i> = I’m a happy person. <i>Estoy feliz</i> = I’m happy today.</p>`},
{t:'Why gustar is “backwards”',e:'🔄',b:`<p><i>Me gusta el café</i> really means “coffee pleases me”. The coffee is the subject, so the verb agrees with it: <i>me gusta</i> (one thing), <i>me gustan</i> (several things).</p><p>English has the same idea in “it appeals to me”. Once you see gustar as “to please”, <i>me gustan los perros</i> stops looking strange.</p>`},
{t:'Why everything is masculine or feminine',e:'⚖️',b:`<p>Latin had genders, and Spanish kept two. It’s grammar, not meaning: a table isn’t “female”. The ending usually tells you: -o masculine, -a feminine, -ción / -dad feminine.</p><p>Why <i>el agua</i> if agua is feminine? Saying “la agua” would merge the two a sounds into one, so Spanish uses <i>el</i> before a stressed “a” sound. It’s still feminine: <i>el agua fría</i>.</p>`},
{t:'Double negatives are correct',e:'🚫',b:`<p>In Spanish, negatives agree with each other: <i>No veo nada</i> (literally “I don’t see nothing”) is perfect Spanish. <i>No viene nadie. No lo hago nunca.</i></p><p>If the negative word comes first, drop the <i>no</i>: <i>Nadie viene. Nunca lo hago.</i></p>`},
{t:'The “personal a”',e:'🧑',b:`<p>When a <b>person</b> (or a pet) receives the action, put <b>a</b> before them: <i>Veo <b>a</b> Ana</i> but <i>Veo la casa</i>. <i>Llamo <b>a</b> mi mamá. Busco <b>a</b> un agente.</i></p><p>Why? Spanish word order is flexible, so the <i>a</i> marks who receives the action. It’s never translated into English.</p>`},
{t:'Why ¿ and ¡ upside down',e:'🙃',b:`<p>A Spanish question can look exactly like a statement: <i>Hablas español.</i> / <i>¿Hablas español?</i> Only the tone changes. So since 1754 Spanish marks the start of a question or exclamation, telling you to raise your voice from the very first word.</p>`},
{t:'Why usted uses the “él” form',e:'🎩',b:`<p><b>Usted</b> comes from <i>vuestra merced</i>, “your grace”. You were literally talking to someone’s grace in the third person, like “Would Your Majesty like tea?” That’s why it uses <i>él / ella</i> verbs and the pronouns <i>su, le, lo / la</i>: <i>¿Usted tiene su número?</i></p>`},
{t:'What the subjunctive really is',e:'🌫️',b:`<p>The indicative states <b>facts</b>. The subjunctive is for things that are <b>not stated as fact</b>: wishes, emotions, doubts, possibilities, and things that haven’t happened yet.</p><p>Memory trick: <b>WEIRDO</b> = Wishes, Emotions, Impersonal expressions, Recommendations, Doubt / denial, Ojalá. <i>Sé que vienes</i> (fact) vs <i>Espero que vengas</i> (wish).</p>`},
{t:'Preterite vs imperfect = photo vs video',e:'🎞️',b:`<p>The <b>preterite</b> is a photo: one finished action with a clear end. <i>Llegué a las ocho.</i> The <b>imperfect</b> is a video running in the background: habits, descriptions, ongoing actions. <i>Llovía y hacía frío.</i></p><p>In a story, the imperfect paints the scene and the preterite tells what happened: <i>Llovía cuando llegué.</i></p>`},
{t:'Por vs para = path vs goal',e:'🏹',b:`<p>Picture an arrow. <b>Para</b> points to the target ahead: purpose, destination, deadline, recipient (<i>para ti, para el lunes, para aprender</i>). <b>Por</b> is the path behind or through: cause, route, means, exchange (<i>gracias por, por el parque, por teléfono, por 100 pesos</i>).</p>`},
{t:'Why “tengo hambre” and not “estoy hambre”',e:'🍽️',b:`<p>Spanish sees hunger, thirst, fear, sleepiness and age as things you <b>have</b>: <i>tengo hambre, tengo sed, tengo miedo, tengo sueño, tengo 25 años</i>. Translate the idea, not the words.</p>`},
{t:'Little words that make things cute: -ito, -ita',e:'🐣',b:`<p>Add <b>-ito / -ita</b> to make something small, cute or friendly: <i>café → cafecito, casa → casita, abuela → abuelita, ahora → ahorita, despacio → despacito</i>. It also softens requests: <i>¿Me esperas un momentito?</i></p><p>The opposite: <b>-ón / -ote</b> for big (<i>grandote</i>), and <b>-ísimo</b> for “very”: <i>riquísimo</i>.</p>`},
{t:'Word order is flexible',e:'🔀',b:`<p>Spanish can move words around for emphasis: <i>Ana llegó tarde / Llegó Ana tarde / Tarde llegó Ana.</i> Verb endings keep it clear who did what.</p><p>Adjectives usually follow the noun (<i>una casa blanca</i>), but a few change meaning before it: <i>un gran hombre</i> (great) vs <i>un hombre grande</i> (big).</p>`},
{t:'How Spanish builds words (learn one, get five)',e:'🧱',b:`<p>Spanish words come in families. Learn the root and the endings do the rest:</p>${TB('ending|meaning|example;-ero / -era|person who does / sells|zapato → zapatero (shoemaker);-ería|shop|pan → panadería (bakery);-dor / -dora|person or machine that does|jugar → jugador (player);-ción|the action|reservar → reservación;des-|un- / opposite|hacer → deshacer (undo);re-|again|hacer → rehacer (redo);in- / im-|not|posible → imposible')}`},
{t:'Why Spanish sounds so fast',e:'⚡',b:`<p>Spanish gives every syllable roughly the same time, and it glues words together: <i>mi amigo</i> sounds like “mia-MI-go”, <i>¿Qué es esto?</i> like “ques-ES-to”. You aren’t slow; you’re hearing chunks, not words.</p><p>Fix: listen to short sentences many times (use the 🐢 button), repeat them out loud, and learn phrases as whole chunks.</p>`},
{t:'One language, many accents',e:'🌎',b:`<p>Spanish from Spain, Mexico, Colombia or Argentina is one language, like British and American English. Main differences: Spain uses <i>vosotros</i> and pronounces <i>z / ce / ci</i> like English “th”; Argentina and Uruguay use <i>vos</i> instead of <i>tú</i>; and everyday words vary (<i>carro / coche</i>, <i>celular / móvil</i>).</p><p>Pick the variety you need most (for many call centers: Latin American) and just learn to recognize the others.</p>`}];

const MYTHS=[['Spanish from Spain and Latin America are different languages.','They’re one language with different accents and some different words, like UK and US English. Speakers understand each other easily.'],['You always need yo, tú, él.','Spanish usually drops subject pronouns because the verb ending shows who. Using them every time sounds robotic.'],['Everybody uses vosotros.','Only Spain. Latin America uses ustedes for every “you all”.'],['“Ll” sounds like “L”.','In almost all of the Spanish-speaking world, ll sounds like y (llamar = “yamar”). In Argentina and Uruguay it sounds like “sh”.'],['Every word ending in -a is feminine.','Many are masculine: el día, el mapa, el problema, el sistema, el idioma, el clima. And la mano, la foto end in -o.'],['Spanish has no word for “it”.','As a subject, “it” is simply dropped: Es importante (It’s important). As an object, it’s lo or la: Lo tengo (I have it).'],['The subjunctive is rare and advanced.','You hear it every day: ¡Que te vaya bien!, Ojalá, Cuando llegues, Quiero que vengas.'],['Natives speak too fast to understand.','Spanish glues words together and times syllables evenly. With repeated listening practice your ear adapts in weeks.'],['Mexican (or any) Spanish is “incorrect”.','Every variety is correct. Mexico actually has the most Spanish speakers in the world.'],['Spanish is hard for Filipinos.','You already know hundreds of Spanish words (mesa, silya, kutsara, sapatos), the same 5 vowels, and Spanish numbers for time and money.'],['Everyone takes a siesta.','In big cities most people work through the afternoon. Spain does have a long lunch break, but few people actually nap.']];

{k:'gu',t:'Gustar & friends',e:'💛',lv:'A1',d:'Gusta or gustan? Me, te, le, nos or les?',w:`Me ___ el café.|gusta|gustan|One thing liked: gusta.

Me ___ los pies.|duelen|duele|Several things hurt → duelen.
A mis padres ___ gusta viajar.|les|le|Several people: les.

¿A usted le ___ el picante?|gusta|gustas|El picante is one thing: gusta.
A mí ___ interesa la historia.|me|mi|Even with “a mí”, you still need me.

¿Qué te ___ más, el té o el café?|gusta|gustan|Asking about one thing: gusta.
Nos ___ mucho tus fotos.|encantan|encanta|Plural thing (fotos): encantan.
A Juan no le ___ madrugar.|gusta|gustan|A verb (madrugar) counts as singular.

{k:'pr',t:'Little words: a, en, de, con',e:'🧭',lv:'A2',d:'The prepositions that every sentence needs.',w:`Voy ___ la playa.|a|en|Movement toward a place takes a.

Sueño ___ viajar por el mundo.|con|de|Soñar con = to dream about.

Quiero una taza ___ café.|de|con|Container + de + content.
Quiero un café ___ leche.|con|de|Con = with.
Ayudo ___ mi hermano con la tarea.|a|(nothing)|Personal a before a person.`},
{k:'mi',t:'Fix the mistake',e:'🛠️',lv:'A2',d:'Pick the sentence a native would say.',w:`Which one is correct?|Tengo 25 años.|Soy 25 años.|Estoy 25 años.|Age always uses tener.
Which one is correct?|Me gustan los perros.|Me gusta los perros.|Yo gusto los perros.|Gustar agrees with the thing liked (los perros → gustan).
Which one is correct?|Tengo calor.|Estoy caliente.|Soy caliente.|For body temperature use tener calor. “Estoy caliente” can mean aroused!
Which one is correct?|Hace frío hoy.|Es frío hoy.|Tiene frío hoy.|Weather uses hacer: hace frío.
Which one is correct?|Pienso en ti.|Pienso de ti.|Pienso a ti.|Pensar en = to think about.
Which one is correct?|Depende de ti.|Depende en ti.|Depende a ti.|Depender de.
Which one is correct?|Me casé con Ana.|Me casé a Ana.|Me casé por Ana.|Casarse con.
Which one is correct?|Voy a la playa.|Voy en la playa.|Voy la playa.|Movement to a place takes a.
Which one is correct?|El lunes trabajo.|En el lunes trabajo.|En lunes trabajo.|Days take el, no preposition: el lunes = on Monday.
Which one is correct?|Veo a mi mamá.|Veo mi mamá.|Veo de mi mamá.|Personal a before people.
Which one is correct?|La gente es amable.|La gente son amables.|Las gentes es amable.|Gente is singular.
Which one is correct?|El problema es grave.|La problema es grave.|Los problema es grave.|Problema is masculine.
Which one is correct?|El agua está fría.|La agua está fría.|El agua está frío.|El agua takes el, but it’s feminine: fría.
Which one is correct?|Es la una.|Son la una.|Es las una.|One o’clock is singular: es la una.
Which one is correct?|No veo nada.|No veo algo.|Veo nada.|Spanish uses double negatives: no… nada.
Which one is correct?|Nadie viene.|No nadie viene.|Nadie no viene.|When nadie comes first, drop no.
Which one is correct?|Me duele la cabeza.|Me duele mi cabeza.|Mi cabeza me duele mi.|With body parts, use el / la, not mi.
Which one is correct?|Estoy en casa.|Soy en casa.|Estoy a casa.|Location takes estar en.
Which one is correct?|Quiero que vengas.|Quiero que vienes.|Quiero tú vengas.|Want + que + another person → subjunctive.
Which one is correct?|Si tuviera dinero, viajaría.|Si tendría dinero, viajaría.|Si tengo dinero, viajaría.|Unreal if: si + imperfect subjunctive + conditional.
Which one is correct?|Estoy de acuerdo.|Soy de acuerdo.|Estoy acuerdo.|Estar de acuerdo = to agree.
Which one is correct?|Tienes razón.|Estás razón.|Eres razón.|Tener razón = to be right.
Which one is correct?|Voy a estudiar.|Voy estudiar.|Voy a estudio.|Ir a + infinitive.
Which one is correct?|Me gusta bailar.|Me gusto bailar.|Me gustan bailar.|Gustar + verb → gusta.
Which one is correct?|Es más alto que yo.|Es más alto de yo.|Es más alto como yo.|Comparisons: más… que.
Which one is correct?|Es mejor.|Es más mejor.|Es el más mejor.|Mejor already means “better”; never “más mejor”.
Which one is correct?|Tengo que trabajar.|Tengo trabajar.|Tengo a trabajar.|Tener que + infinitive = to have to.
Which one is correct?|Hay muchos carros.|Hay mucho carros.|Han muchos carros.|Hay never changes, and mucho agrees: muchos carros.
Which one is correct?|Mi cumpleaños es el 5 de mayo.|Mi cumpleaños es mayo 5.|Mi cumpleaños es en el 5 de mayo.|Dates: el + day + de + month.
Which one is correct?|¿Cuál es tu número?|¿Qué es tu número?|¿Cuál número es tu?|Before es + noun, use cuál.`}];

{t:'Las doce uvas de la suerte',lv:'A1',e:'🍇',b:`En España, el 31 de diciembre, muchas personas comen doce uvas a medianoche. Comen una uva con cada campanada del reloj. Si comes las doce uvas a tiempo, vas a tener suerte todo el año.\nMucha gente mira en la televisión el reloj de la Puerta del Sol, en Madrid. No es fácil: ¡las campanadas son rápidas! Esta tradición también existe en varios países de América Latina.`,g:'la uva=grape;la medianoche=midnight;la campanada=chime of a bell;la suerte=luck;a tiempo=on time',q:`¿Cuántas uvas comen?|Doce|Diez|Una
¿Para qué comen las uvas?|Para tener suerte|Porque tienen hambre|Para no dormir
¿Dónde está el reloj famoso?|En la Puerta del Sol, en Madrid|En Valencia|En México`},
{t:'La batalla de tomates más famosa del mundo',lv:'A2',e:'🍅',b:`Cada año, el último miércoles de agosto, el pueblo de Buñol, en Valencia (España), celebra la Tomatina. Miles de personas de todo el mundo llegan para participar en una gran batalla de tomates.\nLa batalla dura aproximadamente una hora. Los camiones llegan llenos de tomates maduros y la gente los lanza a todos. Al final, las calles están rojas y todos están cansados pero felices. Después, los bomberos limpian las calles con agua. La tradición empezó en 1945 y hoy es una de las fiestas más famosas de España.`,g:'lanzar=to throw;maduro=ripe;los bomberos=firefighters;la batalla=battle;durar=to last',q:`¿Cuándo es la Tomatina?|El último miércoles de agosto|El primer lunes de mayo|El 31 de diciembre
¿Cuánto dura la batalla?|Aproximadamente una hora|Todo el día|Una semana
¿Quiénes limpian las calles?|Los bomberos|Los turistas|Los niños`},
{t:'Día de Muertos: una fiesta para recordar',lv:'A2',e:'💀',b:`En México, el 1 y el 2 de noviembre las familias celebran el Día de Muertos. No es una fiesta triste: es una forma de recordar con alegría a las personas que murieron.\nLas familias preparan altares, llamados ofrendas, con fotos, velas, flores de cempasúchil y la comida favorita de sus seres queridos. También comen pan de muerto y regalan calaveras de azúcar. Muchas personas visitan el cementerio y pasan la noche allí con música. En 2008, la UNESCO incluyó esta tradición en su lista de Patrimonio Cultural Inmaterial de la Humanidad.`,g:'la ofrenda=altar with offerings;la vela=candle;los seres queridos=loved ones;la calavera=skull;el cementerio=cemetery',q:`¿Cuándo es el Día de Muertos?|El 1 y el 2 de noviembre|El 31 de octubre|El 25 de diciembre
¿Qué ponen en la ofrenda?|Fotos, velas, flores y comida|Solo dinero|Árboles de Navidad
¿Cómo es la fiesta?|Alegre: recuerdan a sus seres queridos|Muy triste y en silencio|Es una fiesta deportiva`},
{t:'Las Fallas: arte para quemar',lv:'A2',e:'🔥',b:`Del 15 al 19 de marzo, la ciudad de Valencia, en España, celebra las Fallas. Durante meses, los artistas construyen enormes figuras de cartón y madera, llamadas ninots. Algunas son más altas que un edificio.\nDurante la fiesta hay fuegos artificiales, música y mucha comida, como la paella. La última noche, el 19 de marzo, queman casi todas las figuras en las calles. Este momento se llama la cremà. Solo una figura se salva cada año, gracias al voto del público.`,g:'construir=to build;el cartón=cardboard;la madera=wood;quemar=to burn;los fuegos artificiales=fireworks',q:`¿Dónde se celebran las Fallas?|En Valencia, España|En Ciudad de México|En Buenos Aires
¿Qué pasa el 19 de marzo?|Queman las figuras|Lanzan tomates|Comen doce uvas
¿Cuántas figuras se salvan?|Solo una|Todas|Ninguna`},
{t:'Los Reyes Magos traen regalos',lv:'A2',e:'👑',b:`En España y en muchos países de América Latina, los niños reciben regalos el 6 de enero, el Día de Reyes. La noche anterior, dejan sus zapatos junto a la puerta o la ventana, y a veces agua o comida para los camellos.\nSegún la tradición, Melchor, Gaspar y Baltasar llegan de Oriente con regalos. Ese día se come la rosca de reyes, un pan dulce con forma de corona. Dentro hay una pequeña figura del niño Jesús. En México, quien la encuentra tiene que invitar tamales a todos el 2 de febrero, el Día de la Candelaria.`,g:'el regalo=gift;dejar=to leave;la rosca=ring-shaped bread;la corona=crown;encontrar=to find',q:`¿Cuándo reciben regalos los niños?|El 6 de enero|El 2 de febrero|El 1 de noviembre
¿Qué dejan los niños la noche anterior?|Sus zapatos|Sus libros|Un pastel
En México, ¿qué hace quien encuentra la figura?|Invita tamales el 2 de febrero|Compra los regalos|Canta una canción`},
{t:'Las Posadas: nueve noches de fiesta',lv:'A2',e:'🪅',b:`En México, del 16 al 24 de diciembre se celebran las Posadas. Durante nueve noches, los vecinos recuerdan el viaje de María y José, que buscaban un lugar para dormir en Belén.\nUn grupo de personas camina por las calles con velas y canta en la puerta de una casa para pedir posada. Al final, los dejan entrar y empieza la fiesta: hay ponche caliente, tamales, dulces y una piñata para los niños. La piñata tradicional tiene siete picos.`,g:'la posada=lodging, inn;pedir=to ask for;el ponche=warm fruit punch;los dulces=sweets;el pico=point, spike',q:`¿Cuántas noches duran las Posadas?|Nueve noches|Doce noches|Una noche
¿Qué recuerdan las Posadas?|El viaje de María y José|La independencia de México|El Año Nuevo
¿Qué hay en la fiesta?|Ponche, tamales y una piñata|Uvas y campanadas|Tomates`},
{t:'La quinceañera: una fiesta enorme',lv:'A2',e:'👗',b:`En muchos países de América Latina, cuando una chica cumple quince años, su familia organiza una gran fiesta: la fiesta de quince años o quinceañera. Simboliza el paso de niña a mujer.\nLa quinceañera lleva un vestido elegante, muchas veces largo y de colores. Normalmente baila un vals con su papá y después con sus amigos, que forman la corte de honor. Hay comida, música y un pastel enorme. Para muchas familias, es tan importante como una boda.`,g:'cumplir años=to turn (an age);el paso=step, transition;el vals=waltz;la corte de honor=honor court;la boda=wedding',q:`¿Cuántos años cumple la chica?|Quince|Dieciocho|Doce
¿Con quién baila primero el vals?|Con su papá|Con su profesora|Con el gerente
¿Qué simboliza la fiesta?|El paso de niña a mujer|El final de la escuela|Un nuevo trabajo`},
{t:'¡Gol! El Clásico de España',lv:'A2',e:'⚽',b:`El Clásico es el partido de fútbol entre el Real Madrid y el FC Barcelona, los dos equipos más famosos de España. Millones de personas en todo el mundo lo ven por televisión.\nEs mucho más que un partido: hay una gran rivalidad entre las dos ciudades. Cuando un equipo marca un gol, los aficionados gritan «¡Gooool!» durante varios segundos. En el fútbol también se usan palabras como el árbitro, el portero, el empate y la tarjeta roja.`,g:'el partido=match, game;el equipo=team;marcar un gol=to score a goal;el aficionado=fan;el empate=tie, draw',q:`¿Qué equipos juegan El Clásico?|El Real Madrid y el FC Barcelona|Boca Juniors y River Plate|México y Argentina
¿Qué gritan los aficionados?|¡Gol!|¡Olé!|¡Salud!
¿Qué es un empate?|Cuando los dos equipos tienen los mismos goles|Una tarjeta roja|El portero`},
{t:'El español en el mundo',lv:'B1',e:'🌎',b:`El español es una de las lenguas más habladas del planeta. Cerca de 500 millones de personas lo hablan como lengua materna, y solo el chino mandarín tiene más hablantes nativos.\nEs idioma oficial en más de veinte países, desde México hasta Argentina, además de España y Guinea Ecuatorial, en África. En Estados Unidos, más de 40 millones de personas hablan español en casa. Por eso, saber español abre muchas puertas: en el turismo, en los negocios y, por supuesto, en los centros de llamadas, donde los agentes bilingües son muy buscados.`,g:'la lengua materna=mother tongue;el hablante=speaker;los negocios=business;buscado=sought after;abrir puertas=to open doors',q:`¿Cuántas personas hablan español como lengua materna?|Cerca de 500 millones|Cerca de 50 millones|Más de 2.000 millones
¿Qué lengua tiene más hablantes nativos?|El chino mandarín|El inglés|El francés
¿En qué país de África es oficial el español?|Guinea Ecuatorial|Egipto|Marruecos`},
{t:'Filipinas y el español: una historia compartida',lv:'B1',e:'🇵🇭',b:`Filipinas fue parte del Imperio español durante más de 300 años, desde 1565 hasta 1898. Por eso, el tagalo y otras lenguas filipinas tienen miles de palabras de origen español, como mesa, silya (silla), kutsara (cuchara) o sapatos (zapatos).\nLos días de la semana, los meses y la forma de decir la hora (alas dos) también vienen del español. El español fue lengua oficial hasta 1987. Hoy, en Zamboanga y otras zonas, mucha gente habla chabacano, una lengua criolla basada en el español. Para un filipino, ¡aprender español es casi como volver a casa!`,g:'el imperio=empire;de origen=of origin;la lengua criolla=creole language;basado en=based on;volver a casa=to come back home',q:`¿Cuántos años fue Filipinas parte del Imperio español?|Más de 300 años|50 años|1.000 años
¿Hasta cuándo fue oficial el español?|Hasta 1987|Hasta 1898|Hasta hoy
¿Qué es el chabacano?|Una lengua criolla basada en el español|Una comida típica|Un baile`},
{t:'Inti Raymi: la Fiesta del Sol',lv:'B1',e:'☀️',b:`Cada 24 de junio, en Cusco, Perú, se celebra el Inti Raymi, la Fiesta del Sol. Era la celebración más importante del Imperio inca. En el hemisferio sur, junio es el comienzo del invierno, y los incas le pedían al dios Sol, Inti, que volviera y les diera buenas cosechas.\nHoy, cientos de actores con trajes tradicionales representan la ceremonia en la fortaleza de Sacsayhuamán, y miles de turistas llegan para verla. Gran parte de la ceremonia se habla en quechua, la lengua de los incas, que todavía hablan millones de personas en los Andes.`,g:'la cosecha=harvest;el traje=costume;la fortaleza=fortress;representar=to act out;el comienzo=beginning',q:`¿Cuándo se celebra el Inti Raymi?|El 24 de junio|El 24 de diciembre|El 1 de enero
¿A quién honraban los incas?|Al dios Sol, Inti|A la Luna|Al mar
¿En qué lengua es gran parte de la ceremonia?|En quechua|En inglés|En latín`},
{t:'El Carnaval de Barranquilla',lv:'B1',e:'🎭',b:`El Carnaval de Barranquilla, en Colombia, es uno de los carnavales más grandes del mundo. Se celebra durante cuatro días antes del Miércoles de Ceniza, normalmente en febrero o marzo. Hay desfiles, música de cumbia, salsa y champeta, y disfraces llenos de color.\nUno de los personajes más conocidos es la Marimonda, con una nariz larga y orejas grandes. En 2003, la UNESCO lo declaró Obra Maestra del Patrimonio Oral e Inmaterial de la Humanidad. La cantante Shakira, que nació en Barranquilla, es la artista más famosa de la ciudad.`,g:'el desfile=parade;el disfraz=costume;el personaje=character;Miércoles de Ceniza=Ash Wednesday;declarar=to declare',q:`¿Dónde es este carnaval?|En Barranquilla, Colombia|En Río de Janeiro, Brasil|En Lima, Perú
¿Cuántos días dura?|Cuatro días|Un mes|Un día
¿Cómo es la Marimonda?|Tiene la nariz larga y orejas grandes|Es un caballo blanco|Es una reina`},
{t:'El Camino de Santiago',lv:'B1',e:'🥾',b:`El Camino de Santiago es una ruta de peregrinación que termina en la catedral de Santiago de Compostela, en Galicia, España. Existen muchas rutas, pero la más famosa, el Camino Francés, mide unos 800 kilómetros y empieza en Francia.\nCada año, cientos de miles de personas de todo el mundo lo hacen a pie o en bicicleta, por razones religiosas, deportivas o personales. Los peregrinos llevan una credencial que sellan en cada pueblo. Si caminas al menos los últimos 100 kilómetros, recibes un certificado llamado la Compostela.`,g:'el peregrino=pilgrim;la ruta=route;sellar=to stamp;medir=to measure;a pie=on foot',q:`¿Dónde termina el Camino?|En Santiago de Compostela|En Madrid|En París
¿Cuánto mide el Camino Francés?|Unos 800 kilómetros|Unos 80 kilómetros|Unos 8.000 kilómetros
¿Qué es la Compostela?|Un certificado para los peregrinos|Una comida típica|Una bicicleta`},
{t:'Machu Picchu, la ciudad en las nubes',lv:'B1',e:'⛰️',b:`Machu Picchu es una antigua ciudad inca construida en el siglo XV en las montañas de los Andes, en Perú, a unos 2.400 metros de altura. Durante siglos estuvo casi olvidada, hasta que en 1911 el explorador Hiram Bingham la dio a conocer al mundo.\nSus muros de piedra encajan perfectamente sin usar cemento. Hoy es Patrimonio de la Humanidad y una de las Nuevas Siete Maravillas del Mundo. Para protegerla, el número de visitantes por día es limitado, así que es mejor reservar los boletos con anticipación.`,g:'el siglo=century;olvidado=forgotten;el muro=wall;encajar=to fit together;con anticipación=in advance',q:`¿Dónde está Machu Picchu?|En los Andes, en Perú|En la costa de Chile|En México
¿Qué pasó en 1911?|Hiram Bingham la dio a conocer al mundo|Los incas la construyeron|Se destruyó
¿Por qué hay que reservar con anticipación?|Porque el número de visitantes es limitado|Porque está cerrada|Porque es gratis`}];

const POEMS=[
{t:'¿Qué es poesía?',a:'Gustavo Adolfo Bécquer · Rima XXI (1871)',lv:'A2',es:`¿Qué es poesía?, dices mientras clavas\nen mi pupila tu pupila azul.\n¿Qué es poesía? ¿Y tú me lo preguntas?\nPoesía… eres tú.`,en:`“What is poetry?” you ask, while you fix\nyour blue eyes on mine.\n“What is poetry?” And you’re asking me?\nPoetry… is you.`,n:'One of the most famous love poems in Spanish. Notice <i>eres tú</i> (ser for identity) and <i>me lo preguntas</i> (two object pronouns: me + lo).',g:'clavar=to fix, to nail;la pupila=pupil (of the eye);preguntar=to ask'},
{t:'Por una mirada, un mundo',a:'Gustavo Adolfo Bécquer · Rima XXIII (1871)',lv:'B1',es:`Por una mirada, un mundo;\npor una sonrisa, un cielo;\npor un beso… ¡yo no sé\nqué te diera por un beso!`,en:`For one glance, a world;\nfor one smile, a heaven;\nfor one kiss… I don’t know\nwhat I would give you for a kiss!`,n:'<i>Por</i> here means “in exchange for”, just like <i>lo compré por 100 pesos</i>. <i>Diera</i> is an old-style way of saying <i>daría</i> (would give).',g:'la mirada=look, glance;la sonrisa=smile;el beso=kiss'},
{t:'Volverán las oscuras golondrinas',a:'Gustavo Adolfo Bécquer · Rima LIII (1871)',lv:'B1+',es:`Volverán las oscuras golondrinas\nen tu balcón sus nidos a colgar,\ny otra vez con el ala a sus cristales\njugando llamarán.\nPero aquellas que el vuelo refrenaban\ntu hermosura y mi dicha a contemplar,\naquellas que aprendieron nuestros nombres…\n¡esas… no volverán!`,en:`The dark swallows will return\nto hang their nests on your balcony,\nand once again they’ll tap on its windows\nplayfully with their wings.\nBut those that slowed their flight\nto watch your beauty and my happiness,\nthose that learned our names…\nthose… will not return!`,n:'A lesson in the future tense: <i>volverán, llamarán</i>. And demonstratives: <i>aquellas</i> (those, far away in time), <i>esas</i>.',g:'la golondrina=swallow (bird);el nido=nest;el ala=wing;la dicha=happiness'},
{t:'Yo soy un hombre sincero',a:'José Martí · Versos sencillos I (1891)',lv:'A2',es:`Yo soy un hombre sincero\nde donde crece la palma,\ny antes de morirme quiero\nechar mis versos del alma.`,en:`I am a sincere man\nfrom where the palm tree grows,\nand before I die I want\nto pour out the verses of my soul.`,n:'These lines are sung in the famous Cuban song “Guantanamera”. Notice <i>soy… de</i> (origin with ser) and <i>antes de + infinitive</i>.',g:'sincero=sincere;la palma=palm tree;el verso=line of poetry;el alma=soul (feminine, but “el alma”!)'},
{t:'Cultivo una rosa blanca',a:'José Martí · Versos sencillos XXXIX (1891)',lv:'A2',es:`Cultivo una rosa blanca\nen junio como en enero,\npara el amigo sincero\nque me da su mano franca.\nY para el cruel que me arranca\nel corazón con que vivo,\ncardo ni ortiga cultivo:\ncultivo la rosa blanca.`,en:`I grow a white rose\nin June as in January,\nfor the sincere friend\nwho gives me his honest hand.\nAnd for the cruel one who tears out\nthe heart I live with,\nI grow neither thistle nor nettle:\nI grow the white rose.`,n:'A poem about forgiveness, memorized by schoolchildren across Latin America. Notice <i>ni</i> (neither / nor) and the relative <i>que</i> (who).',g:'cultivar=to grow (plants);franco=honest, open;arrancar=to tear out;el cardo=thistle;la ortiga=nettle'},
{t:'Caminante, no hay camino',a:'Antonio Machado · Proverbios y cantares XXIX (1912)',lv:'B1',es:`Caminante, son tus huellas\nel camino y nada más;\ncaminante, no hay camino,\nse hace camino al andar.\nAl andar se hace camino,\ny al volver la vista atrás\nse ve la senda que nunca\nse ha de volver a pisar.\nCaminante, no hay camino,\nsino estelas en la mar.`,en:`Traveler, your footprints are\nthe path and nothing more;\ntraveler, there is no path,\nthe path is made by walking.\nBy walking the path is made,\nand when you look back\nyou see the trail that you\nwill never step on again.\nTraveler, there is no path,\nonly wakes on the sea.`,n:'Grammar gold: impersonal <i>se</i> (<i>se hace, se ve</i>), <i>al + infinitive</i> = when / while doing (<i>al andar</i>), and <i>sino</i> after a negative.',g:'el caminante=walker, traveler;la huella=footprint;andar=to walk;la senda=path, trail;la estela=wake (trail on water)'},
{t:'Canción de otoño en primavera',a:'Rubén Darío (1905)',lv:'A2',es:`Juventud, divino tesoro,\n¡ya te vas para no volver!\nCuando quiero llorar, no lloro…\ny a veces lloro sin querer.`,en:`Youth, divine treasure,\nyou’re leaving, never to return!\nWhen I want to cry, I don’t cry…\nand sometimes I cry without meaning to.`,n:'<i>Irse</i> = to leave (<i>te vas</i>), <i>para no volver</i> = never to return, <i>sin querer</i> = without meaning to (an expression you’ll use daily).',g:'la juventud=youth;el tesoro=treasure;llorar=to cry;sin querer=without meaning to'},
{t:'Hombres necios',a:'Sor Juana Inés de la Cruz (1689)',lv:'B1+',es:`Hombres necios que acusáis\na la mujer sin razón,\nsin ver que sois la ocasión\nde lo mismo que culpáis.`,en:`Foolish men, who accuse\nwomen without reason,\nnot seeing that you are the cause\nof the very thing you blame.`,n:'Written by a Mexican nun, one of the first voices defending women in the Americas. It uses <b>vosotros</b> forms (<i>acusáis, sois, culpáis</i>), common in old Spanish.',g:'necio=foolish;acusar=to accuse;la ocasión=cause, reason;culpar=to blame'},
{t:'Mi día',a:'Original poem · Espa-Pop',lv:'A1',es:`Me levanto con el sol,\ntomo café en mi balcón.\nTrabajo, hablo, como pan,\ny la noche llega ya.`,en:`I get up with the sun,\nI drink coffee on my balcony.\nI work, I talk, I eat bread,\nand the night is already here.`,n:'Pure present tense. Read it out loud three times and you’ll know it by heart.',g:'levantarse=to get up;el balcón=balcony;ya=already'},
{t:'La lluvia',a:'Original poem · Espa-Pop',lv:'A2',es:`Llueve en Manila, llueve en el mar,\nla calle se moja y no para de cantar.\nYo miro por la ventana, tomo un café:\nmañana habrá sol… ojalá que sí, ya veré.`,en:`It rains in Manila, it rains on the sea,\nthe street gets wet and won’t stop singing.\nI look out the window, I drink a coffee:\ntomorrow there will be sun… I hope so, we’ll see.`,n:'<i>Habrá</i> = there will be (future of hay). <i>No para de</i> = doesn’t stop. <i>Ya veré</i> = I’ll see.',g:'mojarse=to get wet;parar de=to stop (doing);habrá=there will be'},
{t:'Si yo fuera',a:'Original poem · Espa-Pop',lv:'B1+',es:`Si yo fuera el viento, viajaría sin parar;\nsi yo fuera el río, te llevaría hasta el mar.\nPero soy quien soy, y aquí estoy, aprendiendo:\ncada palabra nueva es un mundo que voy viendo.`,en:`If I were the wind, I would travel without stopping;\nif I were the river, I would carry you to the sea.\nBut I am who I am, and here I am, learning:\nevery new word is a world I’m slowly discovering.`,n:'Unreal “if” sentences: <i>si + fuera</i> (imperfect subjunctive) + <i>viajaría</i> (conditional). <i>Ir + -ndo</i> = gradually doing something.',g:'el viento=wind;llevar=to carry;ir viendo=to gradually see'}];

const SONGS=[
{t:'Las mañanitas',a:'Traditional · Mexico',lv:'A2',es:`Estas son las mañanitas\nque cantaba el rey David;\nhoy por ser día de tu santo\nte las cantamos a ti.\nDespierta, mi bien, despierta,\nmira que ya amaneció;\nya los pajarillos cantan,\nla luna ya se metió.`,en:`These are the morning songs\nthat King David used to sing;\nbecause today is your saint’s day\nwe sing them to you.\nWake up, my dear, wake up,\nlook, the day has dawned;\nthe little birds are already singing,\nthe moon has already set.`,n:'Mexico’s birthday song, sung early in the morning. Diminutives (<i>mañanitas, pajarillos</i>), the imperfect (<i>cantaba</i>) and commands (<i>despierta, mira</i>).',g:'la mañanita=early morning (song);amanecer=to dawn;el pajarillo=little bird;meterse=to go in / set (moon)'},
{t:'Cielito lindo',a:'Quirino Mendoza y Cortés · Mexico (1882)',lv:'A2',es:`De la Sierra Morena,\ncielito lindo, vienen bajando\nun par de ojitos negros,\ncielito lindo, de contrabando.\nAy, ay, ay, ay,\ncanta y no llores,\nporque cantando se alegran,\ncielito lindo, los corazones.`,en:`From the Sierra Morena,\nmy darling, coming down\nis a pair of little black eyes,\nmy darling, smuggled in.\nAy, ay, ay, ay,\nsing and don’t cry,\nbecause singing makes\nhearts happy, my darling.`,n:'<i>Cielito lindo</i> (literally “pretty little sky”) means darling. Positive and negative commands side by side: <i>canta</i> / <i>no llores</i>. Gerund: <i>cantando</i>.',g:'el cielito=darling (little sky);bajar=to come down;de contrabando=smuggled;alegrarse=to cheer up'},
{t:'De colores',a:'Traditional',lv:'A2',es:`De colores, de colores\nse visten los campos en la primavera.\nDe colores, de colores\nson los pajaritos que vienen de afuera.\nDe colores, de colores\nes el arco iris que vemos lucir.\nY por eso los grandes amores\nde muchos colores me gustan a mí.`,en:`In colors, in colors\nthe fields dress up in spring.\nIn colors, in colors\nare the little birds that come from far away.\nIn colors, in colors\nis the rainbow we see shining.\nAnd that’s why great loves\nof many colors are what I like.`,n:'A joyful folk song sung all over the Spanish-speaking world. Reflexive <i>se visten</i>, and <i>me gustan a mí</i> (with extra emphasis).',g:'vestirse=to get dressed;el campo=field, countryside;el arco iris=rainbow;lucir=to shine'},
{t:'Los pollitos dicen',a:'Traditional children’s song',lv:'A1',es:`Los pollitos dicen\npío, pío, pío,\ncuando tienen hambre,\ncuando tienen frío.\nLa gallina busca\nel maíz y el trigo,\nles da la comida\ny les presta abrigo.`,en:`The little chicks say\npeep, peep, peep,\nwhen they are hungry,\nwhen they are cold.\nThe hen looks for\ncorn and wheat,\nshe gives them food\nand gives them shelter.`,n:'Every child in the Spanish-speaking world knows it. <i>Tener hambre / frío</i> and <i>les</i> = to them.',g:'el pollito=chick;el trigo=wheat;prestar abrigo=to give shelter'},
{t:'Arroz con leche',a:'Traditional children’s song',lv:'B1',es:`Arroz con leche,\nme quiero casar\ncon una señorita\nde San Nicolás,\nque sepa coser,\nque sepa bordar,\nque sepa abrir la puerta\npara ir a jugar.`,en:`Rice pudding,\nI want to get married\nto a young lady\nfrom San Nicolás,\nwho knows how to sew,\nwho knows how to embroider,\nwho knows how to open the door\nto go out and play.`,n:'A children’s song with B1 grammar! <i>Que sepa</i> is the subjunctive, because he’s describing a person he hasn’t found yet.',g:'casarse con=to marry;coser=to sew;bordar=to embroider'},
{t:'Cumpleaños feliz',a:'Spanish version of “Happy Birthday”',lv:'A1',es:`Cumpleaños feliz,\nte deseamos a ti,\ncumpleaños, querido amigo,\ncumpleaños feliz.`,en:`Happy birthday,\nwe wish you,\nhappy birthday, dear friend,\nhappy birthday.`,n:'Put the person’s name in line 3. In Mexico, people often sing <i>Las mañanitas</i> as well.',g:'desear=to wish;querido=dear'}];
