<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Espa-Pop</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--b1:#ffe3f1;--b2:#dff0ff;--card:#fff;--ink:#3b2a4d;--mute:#9a8aac;--pri:#ff7eb6;--ok:#4cc98a;--bad:#ff6b6b;--gold:#ffc83d;--line:#f3d8ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--b1:#2a1838;--b2:#162a44;--card:#3a2850;--ink:#fbeaff;--mute:#b9a3d0;--line:#54406e}}
:root[data-theme="dark"]{--b1:#2a1838;--b2:#162a44;--card:#3a2850;--ink:#fbeaff;--mute:#b9a3d0;--line:#54406e}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;font-family:Fredoka,ui-rounded,system-ui,sans-serif;font-weight:500;color:var(--ink);background:linear-gradient(160deg,var(--b1),var(--b2)) fixed;-webkit-tap-highlight-color:transparent;user-select:none}
#w{max-width:480px;margin:0 auto;padding:14px 16px 28px}
#top{display:flex;align-items:center;gap:10px;font-weight:700}
.xp{flex:1;height:14px;border-radius:9px;background:var(--line);overflow:hidden}.xp i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--pri));border-radius:9px;transition:width .6s cubic-bezier(.3,1.6,.5,1)}
button{font:inherit;color:inherit;cursor:pointer;border:0}
#top button{background:none;font-size:22px}
.mas{font-size:84px;text-align:center;margin:16px 0 0;animation:bob 2.4s ease-in-out infinite}.mas.hop{animation:hop .6s}
h1{text-align:center;margin:0;font-size:40px;letter-spacing:1px;color:var(--pri)}.sub{text-align:center;color:var(--mute);margin:2px 0 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:18px}
.chip{padding:8px 13px;border-radius:99px;background:var(--card);border:3px solid var(--line);font-size:15px;transition:.2s}.chip.on{background:var(--pri);border-color:var(--pri);color:#fff;transform:scale(1.06)}
.big{display:block;width:100%;margin:10px 0;padding:16px;border-radius:20px;font-size:21px;font-weight:700;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.18);transition:transform .1s,box-shadow .1s}
.big:active,.opt:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.p{background:var(--pri)}.q{background:#8f7bff}.g{background:var(--ok)}.r{background:var(--bad)}
.row{display:flex;gap:10px}.row .big{flex:1;font-size:18px}
.prog{height:12px;border-radius:9px;background:var(--line);margin:14px 0;overflow:hidden}.prog i{display:block;height:100%;background:var(--ok);border-radius:9px;transition:width .4s}
.card{perspective:900px;height:250px;margin:16px 0;animation:pop .4s;cursor:pointer}.card.gone{transition:.25s;transform:translateX(120%) rotate(18deg);opacity:0}
.in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,1.4,.5,1)}.flip .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:4px solid var(--line);border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:14px;box-shadow:0 8px 0 var(--line)}
.face b,.qc b{font-size:36px;line-height:1.15}.face small,.qc small{color:var(--mute)}.face em{color:var(--mute);font-style:normal;font-size:14px}
.face.b{transform:rotateY(180deg);background:linear-gradient(145deg,var(--card),var(--line))}
.say{background:var(--b2);border-radius:50%;width:48px;height:48px;font-size:22px}.face.b small{font-size:19px;line-height:1.3;color:var(--ink)}.exb{margin-top:12px;text-align:center;color:var(--mute);font-size:17px;animation:pop .4s}
.qc{background:var(--card);border:4px solid var(--line);border-radius:26px;text-align:center;padding:22px 12px;margin:12px 0;display:flex;flex-direction:column;gap:6px;animation:pop .4s}
.opt{display:block;width:100%;margin:10px 0;padding:15px;border-radius:18px;font-size:19px;background:var(--card);border:3px solid var(--line);box-shadow:0 5px 0 var(--line);transition:transform .1s,box-shadow .1s;animation:pop .35s backwards}
.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff;animation:pop .4s}.opt.no{background:var(--bad);border-color:var(--bad);color:#fff;animation:shake .4s}
.stars{font-size:54px;text-align:center}.stars span{display:inline-block;animation:pop .5s backwards}
.res{text-align:center}.res h2{font-size:30px;margin:6px 0}
.cf{position:fixed;top:55%;font-size:24px;pointer-events:none;z-index:9;animation:cf 1.1s ease-out forwards}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--gold);color:#3b2a4d;padding:10px 20px;border-radius:99px;font-weight:700;z-index:10;animation:tst 1.6s forwards;box-shadow:0 5px 0 rgba(0,0,0,.15)}
.bg{position:fixed;font-size:30px;opacity:.25;pointer-events:none;z-index:-1;animation:bob 5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(4deg)}}
@keyframes hop{30%{transform:translateY(-34px) scale(1.2)}60%{transform:scale(.92)}}
@keyframes pop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.07)}}
@keyframes shake{25%{transform:translateX(-9px)}50%{transform:translateX(9px)}75%{transform:translateX(-6px)}}
@keyframes cf{30%{transform:translate(calc(var(--x)*.6),var(--y)) rotate(calc(var(--r)*.5))}to{transform:translate(var(--x),calc(var(--y) + 420px)) rotate(var(--r));opacity:0}}
@keyframes tst{0%{opacity:0;top:40px}15%,80%{opacity:1;top:70px}to{opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

let S={xp:0,best:0,mute:false,sel:Object.keys(C)},mode='',seen=0,deck=[],tot=0,cur,Q=[],qi=0,hearts=3,combo=0,right=0,xpG=0,locked=0,O=[],A='';

const sh=a=>{a=[...a];for(let i=a.length;i>1;){const j=Math.random()*i--|0;[a[i],a[j]]=[a[j],a[i]]}return a};

const lvl=()=>S.xp/100+1|0;

const H=h=>{app.innerHTML=h;top()};
function home(){mode='';H(`<div class="mas">😺</div><h1>Espa-Pop</h1><p class="sub">tap · flip · win ✨</p><div class="chips">${Object.entries(C).map(([k,v])=>`<button class="chip ${S.sel.includes(k)?'on':''}" data-a="chip" data-k="${k}">${v[0]} ${v[1]}</button>`).join('')}</div><button class="big p" data-a="fl">🃏 Flashcards</button><button class="big q" data-a="qz">🎮 Quiz time</button>`)}

function nextCard(got){const c=$('.card');c.classList.add('gone');if(got){addXP(3);conf(8);SFX.ok();vib(25)}else{SFX.bad();vib(40)}setTimeout(()=>{const x=deck.shift();seen++;deck.splice(got?Math.floor(deck.length/2+Math.random()*deck.length/2):Math.min(3,deck.length),0,x);fShow()},250)}

function end(){const f=mode=='fl',n=f?tot:Q.length,r=f?3:right/n>=.9?3:right/n>=.6?2:right?1:0,dead=!f&&hearts<1;H(`<div class="mas">${dead?'😿':r>1?'😻':'😺'}</div><div class="res"><div class="stars">${[0,1,2].map(i=>`<span style="animation-delay:${i*.2}s">${i<r?'⭐':'☆'}</span>`).join('')}</div><h2>${f?'Deck cleared!':dead?'Out of hearts!':right+' / '+n+' correct'}</h2><p class="sub">+${xpG} XP${!f?' · best combo 🔥'+S.best:''}</p></div><button class="big p" data-a="${mode}">🔁 Again</button><button class="big q" data-a="home">🏠 Home</button>`);if(r>1||f){SFX.win();vib([40,40,40,40,120]);conf(40)}else SFX.bad()}
const act={chip:b=>{const k=b.dataset.k,i=S.sel.indexOf(k);if(i<0)S.sel.push(k);else if(S.sel.length>1)S.sel.splice(i,1);else{vib(60);return}SFX.tap();vib(8);b.classList.toggle('on');save()},fl:()=>{SFX.tap();vib(10);fStart()},qz:()=>{SFX.tap();vib(10);qStart()},home:()=>{SFX.tap();home()},flip:b=>{SFX.flip();vib(12);b.classList.toggle('flip')},say:(b,e)=>{e.stopPropagation();say(cur.es)},again:()=>nextCard(0),got:()=>nextCard(1),o:pick,mute:()=>{S.mute=!S.mute;save();top();SFX.tap()}};
document.onclick=e=>{const b=e.target.closest('[data-a]');if(b&&act[b.dataset.a])act[b.dataset.a](b,e)};
['🌸','⭐','🍓','🌮','💖','✨'].forEach((e,i)=>{const s=document.createElement('div');s.className='bg';s.textContent=e;s.style.cssText=`left:${8+i*17}%;top:${15+(i*37)%70}%;animation-delay:${i*.7}s`;document.body.append(s)});
