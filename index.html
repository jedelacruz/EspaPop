function setPicker(){const auto=S.set=='auto',cu=curUnit(),ks=auto?[]:S.set;modal(`<div class="shh"><b>📚 What to study</b><button class="x" data-a="close" aria-label="Close">✕</button></div><button class="setopt ${auto?'on':''}" data-a="setauto"><b>✨ Smart (recommended)</b><small>Your current unit plus everything before it: Units 1–${cu+1}. It grows as you learn.</small></button><div class="srow">Or pick your own</div><div class="chips">${DECKS.map(d=>`<button class="chip ${ks.includes(d.k)?'on':''}" data-a="setk" data-k="${d.k}">${d.e} ${d.n?d.n+' · ':''}${esc(d.t)}</button>`).join('')}</div><button class="big p" data-a="close" style="margin-top:18px">Done</button>`,mode=='home'?home:null)}

 H(`<div class="mas">😺</div><h1>Espa-Pop</h1><p class="sub">the Spanish people actually use, one tap at a time</p>
<div class="goal"><span>🎯 Today</span><div class="xp"><i style="width:${Math.min(100,tx/GOAL*100)}%"></i></div><span>${Math.min(tx,GOAL)}/${GOAL} XP</span></div>

<button class="mc m5" data-a="sp0"><i>⚡</i><b>Speed round</b><small>${S.speed?'best '+S.speed:'60 seconds, go!'}</small></button>
<button class="mc m2" data-a="ty"><i>⌨️</i><b>Type it</b><small>spell the Spanish</small></button>

${UNITS.map((d,i)=>{const p=prog(d);return`<button class="urow ${i==cu?'cur':''}" data-a="unit" data-k="${d.k}"><span class="ue">${p>=.8?'✅':d.e}</span><span class="ut"><b>Unit ${i+1} · ${esc(d.t)}</b><span class="ubar"><i style="width:${Math.round(p*100)}%"></i></span></span>${i==cu?'<em>you are here</em>':''}</button>`}).join('')}
<h3 class="sec">Phrase packs</h3>${['phr','cc'].map(k=>{const d=DK[k],p=prog(d);return`<button class="urow" data-a="unit" data-k="${k}"><span class="ue">${d.e}</span><span class="ut"><b>${esc(d.t)}</b><span class="ubar"><i style="width:${Math.round(p*100)}%"></i></span></span></button>`}).join('')}`)}

/* ================= actions ================= */
const ACT={
 home:()=>{SFX.tap();home()},mute:()=>{S.mute=!S.mute;save();top();if(!S.mute)SFX.tap();try{if(S.mute)speechSynthesis.cancel()}catch(e){}},
 settings:()=>{RST=0;settings()},setm:()=>setPicker(),close:()=>closeM(),
 opt:b=>{S[b.dataset.k]=JSON.parse(b.dataset.v);save();SFX.tap();settings();top()},
 tn:b=>{const t=b.dataset.v,i=S.tenses.indexOf(t);if(i<0)S.tenses.push(t);else if(S.tenses.length>1)S.tenses.splice(i,1);else{toast('Keep at least one tense');return}S.tenses=TNS.filter(x=>S.tenses.includes(x));save();SFX.tap();if($('#modal').classList.contains('on'))settings();else verbs()},
 reset:()=>{if(!RST){RST=1;settings();return}RST=0;S=JSON.parse(JSON.stringify(DEF));save();closeM();home();toast('Progress reset')},
 setauto:()=>{S.set='auto';save();SFX.tap();setPicker()},
 setk:b=>{const k=b.dataset.k;let s=S.set=='auto'?[]:[...S.set];s=s.includes(k)?s.filter(x=>x!=k):[...s,k];S.set=s.length?s:'auto';save();SFX.tap();setPicker()},
 daily:()=>{SFX.tap();daily()},fl:()=>{SFX.tap();flash()},qz:()=>{SFX.tap();quiz()},bd:()=>{SFX.tap();build()},ls:()=>{SFX.tap();listen()},ty:()=>{SFX.tap();typeit()},rv:()=>{SFX.tap();review()},
 vm:()=>{SFX.tap();verbs()},vmix:()=>vrun('mix'),vgap:()=>vrun('mc'),vtype:()=>vrun('type'),vbuild:()=>vrun('build'),vdet:()=>vrun('det'),vref:b=>vref(b.dataset.v),
 stl:()=>{SFX.tap();stList()},stlang:b=>{S.stLang=b.dataset.v;save();SFX.tap();stList()},story:b=>{SFX.tap();story(+b.dataset.i)},gb:stGap,sb:stBank,stchk:stCheck,sttr:()=>{ST.tr=true;stDraw()},
 mt0:()=>{SFX.tap();match()},mt:mtTap,sp0:()=>{SFX.tap();speed()},sp:spTap,lt:()=>{SFX.tap();lt()},lo:ltPick,
 unit:b=>{SFX.tap();unitPage(b.dataset.k)},again:()=>{const f=AGAIN;f?f():home()},
 say:b=>say(b.dataset.t),slow:b=>say(b.dataset.t,{rate:.6}),fsay:()=>{const it=FC.deck[0];say(it.es);if(FC.sp&&FC.sp!=it.es)say(FC.sp,{queue:1})},
 flip:b=>{const c=b&&b.classList?b:$('.card');if(!c)return;SFX.flip();vib(10);c.classList.toggle('flip')},fgot:()=>fcNext(1),fagain:()=>fcNext(0),
 o:b=>{if(locked||!Q||Q.k!='mc')return;const ok=Q.opts[+b.dataset.i]==Q.ans;b.classList.add(ok?'ok':'no');if(!ok){const c=[...app.querySelectorAll('.opt')].find(x=>Q.opts[+x.dataset.i]==Q.ans);if(c)c.classList.add('ok')}app.querySelectorAll('.opt').forEach(x=>x.disabled=true);answer(ok)},
 chk:()=>{if(!Q)return;if(Q.k=='type')chkType();else if(Q.k=='build')chkBuild()},
 bt:b=>{if(locked)return;const i=+b.dataset.i,j=BL.indexOf(i);if(j<0)BL.push(i);else BL.splice(j,1);SFX.tap();vib(6);bdraw()},
 next:()=>{if(mode=='q'){R.i++;show()}else if(mode=='st')stList();else hideFb()},
 ac:b=>{const e=LF&&document.body.contains(LF)?LF:$('#ti');if(!e||e.disabled)return;const s=e.selectionStart??e.value.length,t=e.selectionEnd??s;e.value=e.value.slice(0,s)+b.dataset.c+e.value.slice(t);e.focus();try{e.setSelectionRange(s+1,s+1)}catch(x){}}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const f=ACT[b.dataset.a];if(f){if(b.tagName=='BUTTON')e.preventDefault();f(b,e)}});
document.addEventListener('focusin',e=>{if(e.target.classList&&e.target.classList.contains('inp'))LF=e.target});
const cv=v=>v.replace(/([aeiou])'/gi,(m,c)=>{const i='aeiou'.indexOf(c.toLowerCase()),r='áéíóú'[i];return c==c.toUpperCase()?r.toUpperCase():r}).replace(/n~/g,'ñ').replace(/N~/g,'Ñ').replace(/u"/gi,'ü');
document.addEventListener('input',e=>{const x=e.target;if(x.classList&&x.classList.contains('inp')){const n=cv(x.value);if(n!=x.value){const d=x.value.length-n.length,p=(x.selectionStart||n.length)-d;x.value=n;try{x.setSelectionRange(p,p)}catch(err){}}}});
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key,inp=/^(INPUT|TEXTAREA)$/.test((e.target&&e.target.tagName)||''),mod=$('#modal').classList.contains('on');
 if(k=='Escape'){if(mod)closeM();else if(mode!='home')home();return}
 if(mod)return;
 const fbOn=$('#fb').classList.contains('show');
 if(fbOn&&(k=='Enter'||(!inp&&k==' '))){e.preventDefault();ACT.next();return}
 if(inp){if(k=='Enter'){e.preventDefault();chkType()}return}
 if(mode=='fl'){if(k==' '||k=='Enter'){e.preventDefault();ACT.flip()}else if(k=='ArrowRight')ACT.fgot();else if(k=='ArrowLeft')ACT.fagain();return}
 if(k=='Enter'){const b=app.querySelector('[data-a="next"],[data-a="chk"],[data-a="stchk"]:not([disabled])')||(mode=='done'?app.querySelector('[data-a="again"]'):null);if(b){e.preventDefault();b.click()}return}
 if(k=='Backspace'&&mode=='q'&&Q&&Q.k=='build'&&!locked&&BL.length){e.preventDefault();BL.pop();bdraw();return}
 const n=k=='0'?10:+k;if(n>=1&&n<=10){const o=[...app.querySelectorAll('.opt:not([disabled])')];if(o.length){if(o[n-1])o[n-1].click();return}const t=[...app.querySelectorAll('#bk .tile:not([disabled]),.bank .tile:not([disabled])')];if(t[n-1])t[n-1].click()}});
['🌸','⭐','🍓','🌮','💖','✨'].forEach((em,i)=>{const s=document.createElement('div');s.className='bg';s.textContent=em;s.style.cssText=`left:${8+i*17}%;top:${15+(i*37)%70}%;animation-delay:${i*.7}s`;document.body.append(s)});
window.__ESPA={conj,gen,VB,UNITS,DECKS,ALLI,S:()=>S,pool,ACT,qVerb,qDet,qBuild,qListen,qMeaning,qType,STORIES};
home();
})();
