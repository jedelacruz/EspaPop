const MOVIES=[
['Que la Fuerza te acompañe.','Star Wars (1977), Spanish version','“May the Force be with you.”','<b>Que + subjunctive</b> = “may…”: a wish. <i>Acompañar</i> = to go with. Same pattern as <i>¡Que te vaya bien!</i>'],
['Yo soy tu padre.','The Empire Strikes Back (1980), Spanish version','“I am your father.”','<b>Ser</b> for identity and relationships. <i>Tu</i> (your) has no accent; <i>tú</i> (you) does.'],
['Hasta la vista, baby.','Terminator 2 (1991)','“See you later, baby.”','Real Spanish! <i>Hasta la vista</i> = until we see each other again. <i>Hasta luego</i> and <i>hasta pronto</i> work the same way.'],
['Houston, tenemos un problema.','Apollo 13 (1995), Spanish version','“Houston, we have a problem.”','<i>El problema</i> is masculine even though it ends in -a (it comes from Greek).'],
['Siempre nos quedará París.','Casablanca (1942), Spanish version','“We’ll always have Paris.”','<b>Quedar</b> = to remain / be left. Future <i>quedará</i>, with <i>nos</i> = to us: “Paris will always remain to us.”'],
['La vida es como una caja de chocolates.','Forrest Gump (1994), Latin American version','“Life is like a box of chocolates.”','<b>Ser como</b> = to be like. <i>Caja de</i> = box of (container + de + content).'],
['¡Corre, Forrest, corre!','Forrest Gump (1994), Spanish version','“Run, Forrest, run!”','A <b>tú command</b>: same form as él corre. Commas around the name you’re talking to.'],

['Sigue nadando.','Finding Nemo (2003), Spanish version','“Just keep swimming.”','<b>Seguir + -ndo</b> = to keep doing: <i>sigue estudiando, sigue intentando</i>.']];

['¡Manos arriba!','Action movie','Hands up!','<i>Arriba</i> = up. Short commands without a verb are very common.'],

/* ================= more gap stories ================= */
STORIES.push(
{t:'En el mercado',lv:'A1',es:'Hoy [voy] al mercado con mi mamá. Compramos [frutas] y verduras.\n—¿Cuánto [cuestan] los mangos?\n—Cincuenta pesos el kilo.\n—¡Es muy [caro]! ¿Me da dos kilos por [ochenta]?\n—Está bien.\nMi mamá [sabe] regatear muy bien.',en:'Today I [go] to the market with my mom. We buy [fruit] and vegetables.\n—How much are the [mangoes]?\n—Fifty pesos a kilo.\n—That’s very [expensive]! Can you give me two kilos for [eighty]?\n—Okay.\nMy mom [knows] how to bargain very well.'},
{t:'Una videollamada con mi abuela',lv:'A2',es:'Cada domingo [hago] una videollamada con mi abuela. Ella [vive] en Iloilo y yo en Manila. Siempre me [pregunta] si como bien. Hoy le [conté] que estoy aprendiendo español. Ella se [rio] y me dijo: «¡Mi papá [hablaba] español!». Ahora practicamos juntas: ella me [enseña] palabras antiguas.',en:'Every Sunday I [make] a video call with my grandma. She [lives] in Iloilo and I live in Manila. She always [asks] me if I eat well. Today I [told] her that I’m learning Spanish. She [laughed] and said: “My dad [spoke] Spanish!” Now we practice together: she [teaches] me old words.'},
{t:'El primer día de trabajo',lv:'A2',es:'Mi primer día en el call center fue un poco [difícil]. [Llegué] a las ocho y media, muy nerviosa. Mi supervisora me [explicó] el sistema. Por la tarde, [contesté] mi primera llamada en español. El cliente [habló] muy rápido, pero le pedí que [repitiera]. ¡Al final todo [salió] bien!',en:'My first day at the call center was a little [difficult]. I [arrived] at eight thirty, very nervous. My supervisor [explained] the system to me. In the afternoon, I [answered] my first call in Spanish. The customer [spoke] very fast, but I asked him to [repeat]. In the end everything [went] well!'},
{t:'Perdí mi celular',lv:'A2',es:'Ayer [estaba] en el autobús cuando me di cuenta de que no [tenía] mi celular. ¡Qué susto! [Busqué] en mi mochila, pero no estaba. [Llamé] a mi número desde el teléfono de una señora. Un hombre [contestó]: lo había [encontrado] en el asiento. Nos vimos en la parada y me lo [devolvió]. ¡Qué amable!',en:'Yesterday I [was] on the bus when I realized I didn’t [have] my phone. What a scare! I [searched] in my backpack, but it wasn’t there. I [called] my number from a lady’s phone. A man [answered]: he had [found] it on the seat. We met at the stop and he [returned] it to me. How kind!'},
{t:'Cocinamos adobo',lv:'A2',es:'Primero, [corta] el pollo en trozos. Luego, [pon] el pollo en una olla con salsa de soya, vinagre, ajo y pimienta. [Deja] la carne en la salsa treinta minutos. Después, [cocina] todo a fuego lento una hora. No [olvides] las hojas de laurel. ¡Sírvelo con [arroz] blanco!',en:'First, [cut] the chicken into pieces. Then, [put] the chicken in a pot with soy sauce, vinegar, garlic and pepper. [Leave] the meat in the sauce for thirty minutes. After that, [cook] everything on low heat for an hour. Don’t [forget] the bay leaves. Serve it with white [rice]!'},
{t:'Mi vecino nuevo',lv:'A2',es:'Ayer [llegó] un vecino nuevo al edificio. Se [llama] Diego y es de Colombia. Es muy [simpático] y habla un español muy claro. Le [ofrecí] ayuda con las cajas. Después, me [invitó] a tomar un café colombiano. ¡Ahora tengo un [amigo] para practicar español!',en:'Yesterday a new neighbor [arrived] in the building. His [name] is Diego and he’s from Colombia. He’s very [nice] and speaks very clear Spanish. I [offered] him help with the boxes. Afterwards, he [invited] me for a Colombian coffee. Now I have a [friend] to practice Spanish with!'},
{t:'La fiesta sorpresa',lv:'B1',es:'Para el cumpleaños de Carlos, sus amigos [organizaron] una fiesta sorpresa. Le dijeron que [viniera] a casa de Ana a las ocho. Cuando [llegó], todos gritaron: «¡Sorpresa!». Carlos no lo podía [creer]: nunca le [habían] hecho una fiesta así.\n—Ojalá que todos sus cumpleaños [sean] tan felices —dijo su mamá.',en:'For Carlos’s birthday, his friends [organized] a surprise party. They told him to [come] to Ana’s house at eight. When he [arrived], everyone shouted: “Surprise!” Carlos couldn’t [believe] it: nobody [had] ever thrown him a party like that.\n“I hope all his birthdays [are] this happy,” said his mom.'},
{t:'El día que llovió mucho',lv:'B1',es:'Era agosto y [llovía] sin parar. Las calles [estaban] llenas de agua y no había autobuses. Mi jefe nos [dijo] que trabajáramos desde casa. Por suerte, [tenía] mi computadora conmigo. Por la tarde, se [fue] la luz dos horas. Si lo hubiera [sabido], habría comprado más velas.',en:'It was August and it [was] raining nonstop. The streets [were] full of water and there were no buses. My boss [told] us to work from home. Luckily, I [had] my computer with me. In the afternoon, the power went [out] for two hours. If I had [known], I would have bought more candles.'},
{t:'Un correo a mi jefe',lv:'B1',es:'Estimado señor Ramos:\nLe [escribo] para informarle que mañana no [podré] ir a la oficina porque [tengo] una cita con el médico. [He terminado] los informes de esta semana y se los [envío] adjuntos. Si [necesita] algo, puede llamarme al celular.\nMuchas gracias por su comprensión.\nAtentamente,\nAna López',en:'Dear Mr. Ramos:\nI’m [writing] to let you know that tomorrow I [won’t] be able to go to the office because I [have] a doctor’s appointment. I have [finished] this week’s reports and I’m [sending] them to you attached. If you [need] anything, you can call me on my cell phone.\nThank you very much for your understanding.\nSincerely,\nAna López'},
{t:'Mis metas para este año',lv:'B1',es:'Este año [quiero] mejorar mi español. Mi meta es que en diciembre [pueda] tener una conversación de diez minutos sin miedo. Para eso, [estudiaré] veinte minutos cada día y [veré] series en español. También espero que mi empresa me [dé] un ascenso. Si [trabajo] duro, ¡lo voy a conseguir!',en:'This year I [want] to improve my Spanish. My goal is that by December I [can] have a ten-minute conversation without fear. For that, I [will] study twenty minutes every day and I will [watch] series in Spanish. I also hope my company [gives] me a promotion. If I [work] hard, I’m going to make it!'});
/* ================= mini-novela: Ana en Madrid ================= */
const NOVELA=[
{t:'La llegada',lv:'A2',b:`Ana tiene veinticuatro años y es de Manila. Hoy es un día muy importante: acaba de llegar a Madrid para trabajar en la recepción de un hotel.\nEn el aeropuerto, todo es nuevo para ella. Recoge su maleta, toma un taxi y le dice al taxista: «Al centro, por favor». El taxista es muy simpático y habla muy rápido. Ana entiende solo la mitad, pero sonríe.\nSu habitación está en un hostal pequeño cerca de la Puerta del Sol. Está cansada después de un viaje tan largo, pero muy feliz. Por la ventana mira la calle llena de gente y piensa: «Aquí empieza mi nueva vida».`,g:'acabar de=to have just;recoger=to pick up;la mitad=half;sonreír=to smile;el hostal=small, simple hotel',q:`¿De dónde es Ana?|De Manila|De Madrid|De Cebú
¿Por qué está en Madrid?|Para trabajar en un hotel|Para estudiar medicina|De vacaciones
¿Cuánto entiende Ana al taxista?|Solo la mitad|Todo|Nada`},
{t:'El primer día',lv:'A2',b:`A las nueve en punto, Ana llega al hotel. Su jefe, el señor García, es serio pero amable. Le da un uniforme azul y le presenta a Lucía, otra recepcionista. Lucía es de Sevilla y se ríe mucho.\n—Tranquila, aquí todos somos una familia —le dice—. ¿Vale?\nAna aprende rápido que en España la gente dice «vale» todo el tiempo. A las dos de la tarde, Lucía la invita a comer.\n—¿A las dos? En Manila almorzamos a las doce —dice Ana, sorprendida.\nLucía se ríe: —Pues espera a ver la cena. ¡Aquí cenamos a las diez de la noche!`,g:'en punto=sharp (time);presentar=to introduce;tranquila=relax, don’t worry;sorprendido=surprised;pues=well',q:`¿De qué color es el uniforme?|Azul|Rojo|Negro
¿Qué palabra dice mucho la gente en España?|Vale|Chévere|Ándale
¿A qué hora cenan en España, según Lucía?|A las diez de la noche|A las seis de la tarde|A las doce`},
{t:'Perdida en el metro',lv:'A2',b:`El sábado, Ana decide visitar el Museo del Prado. Toma el metro, pero se equivoca de línea y termina al otro lado de la ciudad. Está un poco nerviosa.\nUn chico joven ve que está mirando el mapa y le pregunta: —¿Te puedo ayudar?\nSe llama Pablo y estudia en la universidad. Le explica que tiene que cambiar de línea en la siguiente estación. Mientras esperan el tren, Pablo le pregunta de dónde es.\n—¡Filipinas! Me encanta el adobo —dice él—. Mi abuela tenía una amiga filipina que lo preparaba.\nAna no lo puede creer. Cuando llega el tren, Pablo le da su número: —Si te pierdes otra vez, llámame.`,g:'equivocarse de=to take the wrong…;cambiar de línea=to change lines;mientras=while;perderse=to get lost;siguiente=next',q:`¿Adónde quiere ir Ana?|Al Museo del Prado|A la playa|Al aeropuerto
¿Qué le pasa en el metro?|Se equivoca de línea|Pierde su maleta|Se queda dormida
¿Qué comida conoce Pablo?|El adobo|La paella|Los tacos`},
{t:'Cena a las diez',lv:'B1',b:`El viernes, Lucía invita a Ana a cenar con sus amigos. Quedan a las diez de la noche en un bar de tapas. Piden tortilla de patatas, croquetas y patatas bravas, y todos comparten los platos.\nDespués de comer, nadie se levanta: se quedan hablando durante dos horas.\n—Esto se llama sobremesa —le explica Lucía.\nAna les cuenta que en tagalo hay muchas palabras españolas: mesa, silya, kutsara, sapatos… Los amigos están sorprendidos.\n—¡Entonces ya hablabas español sin saberlo! —dice uno de ellos.\nEsa noche, Ana se siente un poco menos extranjera.`,g:'quedar=to arrange to meet;compartir=to share;la sobremesa=chatting at the table after a meal;sin saberlo=without knowing it;extranjero=foreigner',q:`¿Dónde cenan?|En un bar de tapas|En casa de Pablo|En el hotel
¿Qué es la sobremesa?|Quedarse hablando en la mesa después de comer|Un postre|Una mesa grande
¿Cómo se siente Ana esa noche?|Menos extranjera|Muy enojada|Enferma`},
{t:'Una llamada desde casa',lv:'B1',b:`Una noche, Ana hace una videollamada con su mamá. En Manila es muy temprano por la mañana.\n—¿Estás comiendo bien, anak? Ojalá que no estés pasando frío —le dice su mamá.\nAna le cuenta todo: el hotel, Lucía, Pablo, las cenas tan tarde. Pero cuando ve a su familia en la pantalla, se pone triste.\n—Si pudiera, los traería a todos aquí —dice.\nSu mamá sonríe: —Nosotros estamos bien. Tú sigue adelante.\nDespués de colgar, Ana llora un poco. Luego se lava la cara y abre su libro de español. Mañana tiene mucho trabajo.`,g:'pasar frío=to be cold;ponerse triste=to get sad;seguir adelante=to keep going;colgar=to hang up;lavarse la cara=to wash your face',q:`¿Qué hora es en Manila durante la llamada?|Muy temprano por la mañana|Medianoche|Mediodía
¿Qué haría Ana si pudiera?|Traería a su familia a Madrid|Volvería a Manila mañana|Cambiaría de trabajo
¿Qué hace Ana después de colgar?|Llora un poco y luego estudia|Sale con Pablo|Se duerme en el sofá`},
{t:'Un año después',lv:'B1+',b:`Ha pasado un año. Ana ya habla español con soltura y hasta dice «vale» sin darse cuenta. El señor García la ha nombrado supervisora de recepción, y ahora ella entrena a los recepcionistas nuevos.\nLucía sigue siendo su mejor amiga en Madrid. Y Pablo… bueno, Pablo la llama todos los días, aunque ella ya no se pierde en el metro.\nUn domingo, mientras pasean por el parque del Retiro, Pablo le pregunta: —¿Te arrepientes de haber venido?\nAna mira el lago y sonríe: —Nunca. Si no me hubiera arriesgado, nunca te habría conocido. Y además, ahora sé hacer tortilla de patatas.`,g:'con soltura=fluently;nombrar=to appoint;entrenar=to train;arrepentirse de=to regret;arriesgarse=to take a risk',q:`¿Qué puesto tiene Ana ahora?|Supervisora de recepción|Taxista|Estudiante de medicina
¿Dónde pasean Ana y Pablo?|En el parque del Retiro|En la playa|En el metro
¿Se arrepiente Ana de haber venido?|No, nunca|Sí, mucho|No lo sabe`}];

{t:'At the café',e:'☕',lv:'A1',w:`¡Hola! Buenos días. ¿Qué le sirvo?|Hi! Good morning. What can I get you?|Un café con leche, por favor.|A coffee with milk, please.|Me llamo café.|Estoy un café.|Order with: un / una + item + por favor. Quisiera… is even more polite.
¿Grande o pequeño?|Large or small?|Pequeño, por favor.|Small, please.|Sí, gracias.|Son las dos.|When someone asks “A or B?”, answer with the option.
¿Algo más?|Anything else?|No, eso es todo, gracias.|No, that’s all, thanks.|No, de nada.|Sí, adiós.|Eso es todo = that’s all. De nada answers “gracias”, not a question.
Son tres dólares con cincuenta.|That’s three fifty.|Aquí tiene.|Here you go.|Tengo tres años.|¿Cómo te llamas?|Aquí tiene (formal) / aquí tienes (informal) = here you go.
¡Que tenga un buen día!|Have a nice day!|Gracias, igualmente.|Thanks, you too.|De nada, igualmente.|Lo siento mucho.|Igualmente = likewise / you too.`},
{t:'Meeting someone new',e:'🤝',lv:'A1',w:`Hola, soy Marta. ¿Cómo te llamas?|Hi, I’m Marta. What’s your name?|Me llamo Ana. Mucho gusto.|My name is Ana. Nice to meet you.|Soy bien, gracias.|Tengo Ana.|Me llamo… / Soy… + Mucho gusto.
Mucho gusto, Ana. ¿De dónde eres?|Nice to meet you, Ana. Where are you from?|Soy de Filipinas, ¿y tú?|I’m from the Philippines, and you?|Estoy de Filipinas.|Soy en Manila.|Origin uses ser de.
Soy de México. ¿Qué haces aquí?|I’m from Mexico. What do you do here?|Trabajo en un call center.|I work at a call center.|Hago bien.|Soy trabajo.|¿Qué haces? asks about your job or activity.
¡Qué interesante! ¿Hablas inglés también?|How interesting! Do you speak English too?|Sí, hablo inglés, tagalo y un poco de español.|Yes, I speak English, Tagalog and a little Spanish.|Sí, hablas inglés.|Sí, hablo inglesa.|Answer with the yo form (hablo). Languages are lowercase and masculine: el inglés.
Bueno, me tengo que ir. ¡Nos vemos!|Well, I have to go. See you!|¡Nos vemos! Fue un placer.|See you! It was a pleasure.|¡Bienvenida!|Buenos días, ¿cómo estás?|Goodbyes: nos vemos, hasta luego, fue un placer.`},
{t:'Asking for directions',e:'🗺️',lv:'A2',w:`¿Sí? ¿Le puedo ayudar?|Yes? Can I help you?|Disculpe, ¿dónde está la estación de tren?|Excuse me, where is the train station?|Oye, tú, ¿dónde estación?|Perdón, ¿qué hora es la estación?|With strangers use disculpe (usted) + ¿dónde está…?
Siga derecho dos cuadras y doble a la derecha.|Go straight two blocks and turn right.|¿Dos cuadras y luego a la derecha?|Two blocks and then right?|Sí, soy derecha.|¿Dos cuadras a la cuadra?|Repeating the key information to check is natural and polite.
Exacto. La estación está enfrente del banco.|Exactly. The station is across from the bank.|Perfecto. ¿Está lejos?|Perfect. Is it far?|Perfecto. ¿Es lejos?|Perfecto. ¿Hay lejos?|Distance and location use estar: ¿Está lejos?
No, está a cinco minutos a pie.|No, it’s a five-minute walk.|¡Muchas gracias, muy amable!|Thank you so much, very kind!|De nada, muy amable.|Lo siento mucho.|Thank people with: muchas gracias, muy amable.
De nada. ¡Que le vaya bien!|You’re welcome. Have a good one!|Igualmente, adiós.|You too, bye.|Sí, me va.|Muy bien, ¿y usted?|¡Que le vaya bien! = have a good one. Answer: igualmente / gracias.`},
{t:'At the doctor',e:'🩺',lv:'A2',w:`Buenas tardes. ¿Qué le pasa?|Good afternoon. What’s wrong?|Me duele mucho la garganta.|My throat hurts a lot.|Me duelo la garganta.|Tengo dolor mi garganta mucho.|Doler works like gustar: me duele + the body part.
¿Desde cuándo se siente así?|Since when have you felt like this?|Desde hace tres días.|For three days.|Hace tres días que.|Por tres días pasado.|Desde hace + time = for (that long).
¿Tiene fiebre?|Do you have a fever?|Sí, anoche tuve fiebre.|Yes, I had a fever last night.|Sí, anoche estuve fiebre.|Sí, soy fiebre.|Tener fiebre = to have a fever.
Le voy a recetar unas pastillas. Tome una cada ocho horas.|I’ll prescribe some pills. Take one every eight hours.|¿Las tomo con comida?|Do I take them with food?|¿Las como con pastillas?|¿Tomo una cada ocho años?|Asking to clarify is smart. Las = them (the pills).
Sí, con comida. Y descanse mucho.|Yes, with food. And rest a lot.|Muchas gracias, doctora.|Thank you very much, doctor.|Gracias, descanse usted.|Sí, mucho descanso yo.|Thank the doctor politely.`},
{t:'Job interview',e:'💼',lv:'B1',w:`Cuénteme un poco sobre usted.|Tell me a little about yourself.|Me llamo Ana y tengo tres años de experiencia en servicio al cliente.|My name is Ana and I have three years of customer service experience.|Me llamo Ana y soy tres años de experiencia.|Cuento un poco sobre usted.|Experience and years use tener.
¿Por qué quiere trabajar con nosotros?|Why do you want to work with us?|Porque me gustaría crecer profesionalmente en una empresa como esta.|Because I’d like to grow professionally at a company like this one.|Por qué quiero trabajar.|Para porque me gusta.|Porque (because) + reason. Me gustaría sounds polite and professional.
¿Cuál es su mayor fortaleza?|What is your greatest strength?|Soy paciente y sé escuchar a los clientes.|I’m patient and I know how to listen to customers.|Estoy paciente siempre.|Mi fortaleza es fuerte.|Personality traits use ser.
¿Ha trabajado alguna vez en el turno de noche?|Have you ever worked the night shift?|Sí, he trabajado de noche durante dos años.|Yes, I’ve worked nights for two years.|Sí, he trabajo de noche.|Sí, trabajaré de noche ayer.|Present perfect: he + participle (trabajado).
Muy bien. ¿Tiene alguna pregunta para nosotros?|Very good. Do you have any questions for us?|Sí, ¿cuándo podría empezar?|Yes, when could I start?|No, gracias, adiós para siempre.|Sí, ¿cuánto años tienen?|Always ask a question. The conditional (podría) sounds polite.`},
{t:'Billing call (you’re the agent)',e:'🎧',lv:'B1',w:`Hola, tengo un problema con mi factura.|Hi, I have a problem with my bill.|Lamento escuchar eso. ¿Me podría dar su número de cuenta?|I’m sorry to hear that. Could you give me your account number?|No es mi problema.|Hola, tengo una factura también.|Empathize first, then verify.
Sí, es el 4521.|Yes, it’s 4521.|Gracias. ¿Me confirma su nombre completo, por favor?|Thank you. Can you confirm your full name, please?|Gracias. ¿Cuál es tu nombre, amigo?|Gracias. ¿Me confirmas tu edad?|Stay formal (usted) and verify the caller’s identity.
Ana López. Me cobraron dos veces este mes.|Ana López. I was charged twice this month.|Déjeme revisar su cuenta… Sí, veo el cargo duplicado.|Let me check your account… Yes, I see the duplicate charge.|Usted pagó dos veces porque quiso.|Déjame revisar tu cuenta, ¿vale?|Check before answering, and keep using usted.
¿Y me van a devolver el dinero?|And are you going to give me my money back?|Sí, voy a solicitar un reembolso. Se verá reflejado en cinco días hábiles.|Yes, I’ll request a refund. It will show up within five business days.|Sí, devolveré el dinero ayer.|No sé, quizás nunca.|Give the solution and the time frame.
Perfecto, muchas gracias.|Perfect, thank you very much.|A usted. ¿Hay algo más en lo que pueda ayudarle?|Thank you. Is there anything else I can help you with?|De nada, chao.|Gracias a ti, amiga.|Close professionally and offer more help.`},
{t:'Hotel check-in',e:'🏨',lv:'B1',w:`Buenas noches, bienvenida. ¿Tiene una reserva?|Good evening, welcome. Do you have a reservation?|Sí, tengo una reserva a nombre de Ana López.|Yes, I have a reservation under the name Ana López.|Sí, soy una reserva.|Sí, reservo a nombre mañana.|A nombre de = under the name of.
Perfecto. ¿Me permite su pasaporte?|Perfect. May I see your passport?|Claro, aquí tiene.|Of course, here you go.|Claro, aquí tengo.|No, es mío.|Aquí tiene = here you go (formal).
Su habitación es la 305. El desayuno es de siete a diez.|Your room is 305. Breakfast is from seven to ten.|¿El desayuno está incluido?|Is breakfast included?|¿El desayuno es incluyendo?|¿Desayuno yo incluido?|Estar incluido = to be included.
Sí, está incluido. ¿Necesita algo más?|Yes, it’s included. Do you need anything else?|¿Me podría decir la contraseña del wifi?|Could you tell me the wifi password?|¿Me podías la wifi?|¿Dónde está la contraseña de mí?|¿Me podría + infinitive…? is the polite way to ask.
Claro, está en la tarjeta de su llave. ¡Que disfrute su estancia!|Sure, it’s on your key card. Enjoy your stay!|Muchas gracias, muy amable.|Thank you very much, very kind.|Sí, que disfruto.|¿Qué es estancia?|Thank the receptionist and you’re done!`},
{t:'Making plans with a friend',e:'📱',lv:'B1',w:`Oye, ¿qué vas a hacer el sábado?|Hey, what are you doing on Saturday?|Todavía no sé. ¿Por qué?|I don’t know yet. Why?|Hice muchas cosas el sábado.|Voy hacer nada.|Plans use ir a + infinitive; todavía no = not yet.
Hay un concierto en el parque. ¿Quieres ir?|There’s a concert in the park. Do you want to go?|¡Claro que sí! ¿A qué hora es?|Of course! What time is it?|¡Claro que sí! ¿A qué hora está?|Sí, quiero que voy.|Events use ser: ¿A qué hora es?
Empieza a las ocho. ¿Nos vemos a las siete y media?|It starts at eight. Shall we meet at seven thirty?|Perfecto. Si llego tarde, te aviso.|Perfect. If I’m late, I’ll let you know.|Perfecto. Si llegaré tarde, te aviso.|Perfecto. Si llegara tarde, te aviso mañana.|A real “if”: si + present.
¿Invitamos a Carlos también?|Shall we invite Carlos too?|Sí, dile que venga.|Yes, tell him to come.|Sí, dile que viene.|Sí, dígale que vengo.|Telling someone to do something: decir que + subjunctive.
¡Buenísimo! Nos vemos el sábado.|Great! See you on Saturday.|¡Nos vemos! Que tengas buena semana.|See you! Have a good week.|¡Nos vemos! Que tienes buena semana.|Adiós, nos vimos.|Wishes: que + subjunctive (que tengas).`}];

let MT=null;
function match(){const P=[],seen=new Set();for(const it of pickItems(40,x=>x.es.length<=24&&x.en.length<=28))if(!seen.has(it.en)){seen.add(it.en);P.push(it)}if(P.length<6){toast('Need at least 6 words');return}mode='mt';AGAIN=match;const rs=[];for(let i=0;i+6<=P.length&&rs.length<3;i+=6)rs.push(P.slice(i,i+6));MT={rs,r:0,t0:Date.now(),miss:0,sel:null,left:6};mtShow()}
function mtShow(){const r=MT.rs[MT.r];MT.left=6;MT.sel=null;H(sbar(MT.r/MT.rs.length,'⏱ <span id="mtt">'+Math.round((Date.now()-MT.t0)/1000)+'s</span>')+`<p class="sub c" style="margin:0 0 12px">Round ${MT.r+1} of ${MT.rs.length} · match each pair</p><div class="mgrid"><div>${sh(r).map(it=>`<button class="mt" data-a="mt" data-s="l" data-id="${esc(it.id)}">${esc(it.es)}</button>`).join('')}</div><div>${sh(r).map(it=>`<button class="mt" data-a="mt" data-s="r" data-id="${esc(it.id)}">${esc(it.en)}</button>`).join('')}</div></div>`);TMR=setInterval(()=>{const e=$('#mtt');if(e)e.textContent=Math.round((Date.now()-MT.t0)/1000)+'s'},250)}
function mtTap(b){if(mode!='mt'||b.classList.contains('done'))return;const s=b.dataset.s,id=b.dataset.id;
 if(!MT.sel||MT.sel.dataset.s==s){if(MT.sel)MT.sel.classList.remove('sel');MT.sel=b;b.classList.add('sel');if(s=='l')say(BYID[id].es);else SFX.tap();return}
 const a=MT.sel;MT.sel=null;a.classList.remove('sel');
 if(a.dataset.id==id){a.classList.add('done');b.classList.add('done');SFX.ok();vib(20);const it=BYID[id];mark(it,true);addXP(4);if(s=='r')say(it.es);if(--MT.left==0)setTimeout(()=>{if(mode!='mt')return;MT.r++;MT.r<MT.rs.length?mtShow():mtEnd()},450)}
 else{[a,b].forEach(x=>{x.classList.add('wrong');setTimeout(()=>x.classList.remove('wrong'),420)});MT.miss++;mark(BYID[a.dataset.s=='l'?a.dataset.id:id],false);SFX.bad();vib(40)}}
function mtEnd(){mode='done';const t=Math.round((Date.now()-MT.t0)/1000),full=MT.rs.length==3,rec=full&&(!S.match||t<S.match);if(rec){S.match=t;save()}H(`<div class="res"><div class="mas">😻</div><h2>⏱ ${t} seconds</h2><p class="sub">${MT.miss} wrong tries${full?' · best '+S.match+'s':''}${rec?' · 🏆 new record!':''}</p></div><button class="big p" data-a="again">🔁 Play again</button><button class="big q" data-a="home">🏠 Home</button>`);SFX.win();conf(rec?50:25)}

function stList(){mode='stl';AGAIN=stList;const L=S.stLang;H(back('📖 Story gaps',STF)+`<p class="sub c" style="margin:0 0 14px">Read a short story and fill in the missing words. ${STORIES.length} stories, A1 to B1+.</p><div class="seg">${[['es','Fill in Spanish'],['en','Fill in English']].map(([v,l])=>`<button class="${L==v?'on':''}" data-a="stlang" data-v="${v}">${l}</button>`).join('')}</div><p class="mute c" style="margin:0 0 6px">${L=='es'?'The Spanish story has gaps. Peek at the English if you get stuck.':'Read the Spanish, then complete the English translation. Great for checking you really understood.'}</p>${['A1','A2','B1','B1+'].map(lv=>{const rows=STORIES.map((s,i)=>[s,i]).filter(x=>x[0].lv==lv);return rows.length?`<h3 class="sec">${lv}</h3><div class="slist">${rows.map(([s,i])=>{const b=S.stories[L+i];return`<button class="strow" data-a="story" data-i="${i}"><span class="lvb">${s.lv}</span><b>${esc(s.t)}</b><em>${b!=null?(b==100?'⭐ ':'')+b+'%':'new'}</em></button>`}).join('')}</div>`:''}).join('')}`)}
function story(i){const s=STORIES[i],L=S.stLang,parts=s[L].split(/\[([^\]]+)\]/),ans=parts.filter((p,k)=>k%2),A=ans.map(nw);const others=uniq(STORIES.flatMap((x,j)=>j==i?[]:(x[L].match(/\[([^\]]+)\]/g)||[]).map(m=>m.slice(1,-1)))).filter(w=>!A.includes(nw(w)));mode='st';AGAIN=()=>story(i);ST={i,L,parts,ans,fill:ans.map(()=>null),act:0,bank:sh([...ans,...sh(others).slice(0,3)]),done:false,tr:false};stDraw();setTimeout(()=>{if(L=='en')say(strip(s.es))},300)}
function stDraw(){const s=STORIES[ST.i];let k=-1;const body=ST.parts.map((p,j)=>{if(j%2==0)return br(p);k++;const f=ST.fill[k],w=f!=null?ST.bank[f]:null;let cls=w!=null?'fill':'',inner=w!=null?esc(w):'&nbsp;';
  if(ST.done){const ok=w!=null&&nw(w)==nw(ST.ans[k]);cls=ok?'ok':'no';inner=ok?esc(w):`${w!=null?`<s>${esc(w)}</s>`:''}${esc(ST.ans[k])}`}else if(k==ST.act)cls+=' act';
  return`<button class="gb ${cls}" data-a="gb" data-i="${k}">${inner}</button>`}).join('');
 const other=ST.L=='es'?strip(s.en):strip(s.es);
 H(sbar(ST.fill.filter(x=>x!=null).length/ST.ans.length,'')+`<div class="sth"><b>${esc(s.t)}</b><span class="lvb">${s.lv}</span><button class="say mini" data-a="say" data-t="${esc(strip(s.es))}" aria-label="Read aloud">🔊</button></div>${ST.L=='en'?`<div class="stsrc"><small class="mute">🇪🇸 Read the Spanish</small><p>${br(other)}</p></div><p class="mute" style="margin:0 0 8px">Now complete the English:</p>`:''}<div class="stbody">${body}</div>${ST.L=='es'?(ST.tr||ST.done?`<div class="trp">${br(other)}</div>`:`<button class="trb" data-a="sttr">👀 Peek at the English</button>`):''}${ST.done?'':`<div class="tl bank">${ST.bank.map((w,j)=>`<button class="tile${ST.fill.includes(j)?' ghost':''}" data-a="sb" data-i="${j}" ${ST.fill.includes(j)?'disabled':''}>${esc(w)}</button>`).join('')}</div><button class="big g" data-a="stchk" ${ST.fill.includes(null)?'disabled':''}>Check</button>`}`)}

function stBank(b){if(ST.done)return;const j=+b.dataset.i;if(ST.act<0||ST.fill[ST.act]!=null)ST.act=ST.fill.indexOf(null);if(ST.act<0)return;ST.fill[ST.act]=j;SFX.tap();vib(8);let n=-1;for(let d=1;d<=ST.ans.length;d++){const x=(ST.act+d)%ST.ans.length;if(ST.fill[x]==null){n=x;break}}ST.act=n;stDraw()}
function stCheck(){if(ST.done||ST.fill.includes(null))return;ST.done=true;const right=ST.fill.filter((f,k)=>nw(ST.bank[f])==nw(ST.ans[k])).length,n=ST.ans.length,pc=Math.round(right/n*100),key=ST.L+ST.i;S.stories[key]=Math.max(S.stories[key]||0,pc);save();R=null;addXP(right*5+(right==n?10:0));stDraw();const ok=right==n;if(ok){SFX.win();conf(40)}else if(right>=n/2)SFX.ok();else SFX.bad();fb(right>=n/2,`${right} of ${n} correct`,ok?'Perfect story! Try it again in the other language.':'Red blanks show the right word.',strip(STORIES[ST.i].es))}
